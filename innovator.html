<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>ForgeAI - Innovator</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 24px;
            margin: 0;
            background: #ffffff;
            color: #111;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 12px;
            color: #111;
            text-decoration: none;
            font-weight: 600;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 34px;
        }

        .subtitle {
            margin: 0 0 22px;
            color: #333;
            max-width: 720px;
            line-height: 1.4;
        }

        .generator {
            border: 1px solid #e6e6e6;
            border-radius: 14px;
            background: #fafafa;
            padding: 16px;
            margin-bottom: 14px;
        }

        .generator h2 {
            margin: 0 0 14px;
            font-size: 18px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: 700;
            color: #222;
        }

        textarea, select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #d9d9d9;
            font-size: 14px;
            background: #fff;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .actions {
            margin-top: 14px;
        }

        button {
            border: none;
            padding: 12px 14px;
            border-radius: 12px;
            background: #111;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.95;
        }

        .error {
            border: 1px solid #ffb3b3;
            background: #fff0f0;
            color: #8a0000;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .chat {
            border: 1px solid #e6e6e6;
            border-radius: 14px;
            background: #fafafa;
            padding: 16px;
            margin-top: 18px;
        }

        .chat h2 {
            margin: 0 0 12px;
            font-size: 18px;
        }

        .chat-messages {
            border: 1px solid #e9e9e9;
            background: #fff;
            border-radius: 12px;
            height: 320px;
            overflow: auto;
            padding: 12px;
            margin-bottom: 12px;
        }

        .chat-row {
            margin: 10px 0;
            display: flex;
        }

        .chat-row.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 80%;
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid #ededed;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
        }

        .chat-row.user .bubble {
            background: #111;
            color: #fff;
            border-color: #111;
        }

        .chat-row.assistant .bubble {
            background: #fcfcfc;
        }

        .chat-compose {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .chat-input {
            flex: 1;
            min-height: 54px;
            resize: vertical;
        }

        .thinking {
            margin-top: 10px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="index.html">← Back</a>

        <h1>ForgeAI - Innovator</h1>
        <p class="subtitle">
            You lead the project—ForgeAI acts as a technical assistant for open-ended builds.
        </p>

        <div class="generator">
            <h2>Chat Preferences</h2>

            <label for="engineeringField">Field of engineering you are most interested in</label>
            <select id="engineeringField">
                <option value="">Select a field (optional)</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Electrical Engineering">Electrical Engineering</option>
                <option value="Civil Engineering">Civil Engineering</option>
                <option value="Aerospace Engineering">Aerospace Engineering</option>
                <option value="Robotics">Robotics</option>
                <option value="AI and Software Engineering">AI and Software Engineering</option>
                <option value="Biomedical Engineering">Biomedical Engineering</option>
                <option value="Environmental Engineering">Environmental Engineering</option>
                <option value="Other">Other</option>
            </select>

            <label for="education">Education / age</label>
            <select id="education" onchange="updateDifficulty()">
                <option value="middle">Middle-Schooler (10–14)</option>
                <option value="high">High-Schooler (15–18)</option>
                <option value="student">Student (18–25)</option>
                <option value="adult">Adult (25+)</option>
            </select>
            <input type="hidden" id="age" value="" />

            <label for="difficulty">Difficulty (estimated time)</label>
            <select id="difficulty"></select>

            <label for="materials">What materials do you have?</label>
            <textarea id="materials" placeholder="List what you already have (be as specific as you can)"></textarea>
        </div>

        <div class="chat" id="chatPanel">
            <h2>Chat (Innovator Mode)</h2>
            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-compose">
                <textarea id="chatInput" class="chat-input" placeholder="Ask ForgeAI for help. For example: 'Help me choose a sensor and design the steps.'" ></textarea>
                <button id="sendBtn" style="height: 54px;">Send</button>
            </div>
            <div id="chatThinking" class="thinking" style="display:none;">ForgeAI is thinking...</div>
            <div class="footer-note" id="chatHint" style="margin-top: 10px;">
                Tip: set your preferences above, then chat naturally and iterate your build with ForgeAI.
            </div>
        </div>
    </div>

    <script>
        const MODE = "Innovator";
        localStorage.setItem("forge_mode", MODE);

        // -------------------------
        // Chat state
        // -------------------------
        let chatHistory = []; // { role: 'user'|'assistant', content: string }
        let lastSelectedProjectName = "";

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll("\"", "&quot;")
                .replaceAll("'", "&#39;");
        }

        function nlToBr(escaped) {
            return escaped.replace(/\n/g, "<br>");
        }

        function getEducationLabel() {
            const education = document.getElementById("education").value;
            const labels = {
                middle: "Middle-Schooler(10-14 years old)🖍️",
                high: "High-Schooler(15-18 years old)🏫",
                student: "Student(18-25 years old)🎓",
                adult: "Adult"
            };
            return labels[education] || null;
        }

        function buildChatContext() {
            const materials = document.getElementById("materials").value.trim();
            const difficulty = document.getElementById("difficulty").value;
            const age = document.getElementById("age").value;
            const engineeringField = document.getElementById("engineeringField").value;
            const parts = [
                `Mode: ${MODE}`,
                lastSelectedProjectName ? `Selected project: ${lastSelectedProjectName}` : null,
                materials ? `Materials: ${materials}` : null,
                difficulty ? `Difficulty: ${difficulty}` : null,
                age ? `Age: ${age}` : null,
                engineeringField ? `Engineering field focus: ${engineeringField}` : null
            ].filter(Boolean);

            return parts.join("\n");
        }

        function appendChatMessage(role, text) {
            const messagesEl = document.getElementById("chatMessages");
            const row = document.createElement("div");
            row.className = `chat-row ${role}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            // Use textContent to avoid HTML injection; pre-wrap styling preserves newlines.
            bubble.textContent = text;

            row.appendChild(bubble);
            messagesEl.appendChild(row);

            // Scroll to bottom after render.
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function updateDifficulty() {
            const education = document.getElementById("education").value;
            const difficulty = document.getElementById("difficulty");
            const ageHidden = document.getElementById("age");

            let options = [];
            let ageValue = "";

            if (education === "middle") {
                options = ["Easy (5–10 min)", "Medium (15–30 min)", "Hard (30–45 min)"];
                ageValue = "10-14";
            } else if (education === "high") {
                options = ["Easy (10–30 min)", "Medium (45–60 min)", "Hard (60–90 min)"];
                ageValue = "15-18";
            } else if (education === "student") {
                options = ["Easy (30–60 min)", "Medium (60–120 min)", "Hard (2 days–1 week)"];
                ageValue = "18-25";
            } else {
                options = ["Easy (30–60 min)", "Medium (60–180 min)", "Hard (5 days–2 weeks)"];
                ageValue = "25+";
            }

            ageHidden.value = ageValue;
            difficulty.innerHTML = options.map(o => `<option>${o}</option>`).join("");
        }

        async function sendMessage() {
            const inputEl = document.getElementById("chatInput");
            const userText = inputEl.value.trim();
            if (!userText) return;

            // Optimistically render user message.
            appendChatMessage("user", userText);
            inputEl.value = "";

            const sendBtn = document.getElementById("sendBtn");
            const chatThinking = document.getElementById("chatThinking");
            sendBtn.disabled = true;
            sendBtn.textContent = "Sending...";
            chatThinking.style.display = "block";

            // Add context into the message (backend does not have a separate memory field).
            const context = buildChatContext();
            const messageToSend = context ? `${context}\n\n${userText}` : userText;

            try {
                const response = await fetch("http://127.0.0.1:8000/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: messageToSend,
                        mode: MODE,
                        history: chatHistory,
                        education: getEducationLabel()
                    })
                });

                const data = await response.json();
                if (!data || !data.reply) {
                    appendChatMessage("assistant", "Sorry, I couldn't generate a reply. Please try again.");
                    return;
                }

                appendChatMessage("assistant", data.reply);

                // Update local history for next turn.
                chatHistory.push({ role: "user", content: userText });
                chatHistory.push({ role: "assistant", content: data.reply });
            } catch (e) {
                appendChatMessage("assistant", `Request failed: ${e && e.message ? e.message : String(e)}`);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "Send";
                chatThinking.style.display = "none";
            }
        }

        // Wire up chat events.
        document.getElementById("sendBtn").addEventListener("click", sendMessage);
        document.getElementById("chatInput").addEventListener("keydown", (e) => {
            // Enter to send, Shift+Enter to add newline.
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        updateDifficulty();

        // Initial assistant nudge (no backend call).
        appendChatMessage(
            "assistant",
            "Hi! I'm your Innovator assistant. You lead the build—tell me your next decision (materials, design, steps) and I'll help you refine it."
        );
    </script>
</body>
</html>
