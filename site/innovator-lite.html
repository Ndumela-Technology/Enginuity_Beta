<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enginuity Beta · Innovator Beta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />
  <script src="enginuity-theme.js"></script>
  <link rel="stylesheet" href="enginuity.css" />
  <link rel="stylesheet" href="project-output.css" />
  <link rel="stylesheet" href="spark-helper.css" />
  <link rel="stylesheet" href="contact.css" />
  <link rel="stylesheet" href="beta-feedback.css" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="alternate icon" href="assets/logo.svg" />
    <link rel="stylesheet" href="mode-pages.css" />
</head>
<body class="enginuity-paper">
  <div class="lite-wrap">
    <a class="back" href="index.html">← Back</a>
    <section class="lite-panel">
      <h1 class="lite-title" id="litePageTitle">Enginuity Beta · Innovator Beta</h1>
      <p class="lite-sub" id="litePageSub">
        Substantial engineering projects with multi-part builds, Concept Render, and SparkHelper — up to 2 days for signed-in Beta testers. Full Innovator mode is coming later.
      </p>
      <label for="liteEducation"><strong>Education / age</strong></label>
      <select id="liteEducation" class="lite-education" style="display:block;width:100%;max-width:420px;margin:0.35rem 0 0.85rem;"></select>
      <label for="liteField"><strong>Engineering field</strong></label>
      <select id="liteField" class="lite-education" style="display:block;width:100%;max-width:420px;margin:0.35rem 0 0.85rem;"></select>
      <div id="liteDifficultyWrap" style="display:none;">
        <label for="liteDifficulty"><strong>Difficulty (estimated time)</strong></label>
        <select id="liteDifficulty" class="lite-education" style="display:block;width:100%;max-width:420px;margin:0.35rem 0 0.85rem;">
          <option>Easy: 45–90 min</option>
          <option selected>Medium: 4–12 hours</option>
          <option>Hard: 1–2 days</option>
        </select>
      </div>
      <label for="liteGoal"><strong>Project goal or idea</strong></label>
      <textarea id="liteGoal" class="lite-materials" style="min-height:4.5rem;margin-bottom:0.85rem;" placeholder="Example: I want an aerospace project that flies using my materials."></textarea>
      <label for="liteMaterials"><strong>Available materials (comma or new line)</strong></label>
      <textarea id="liteMaterials" class="lite-materials" placeholder="Example: paper cups, tape, string, coins"></textarea>
      <div class="lite-actions">
        <button type="button" id="liteGenerateBtn">Generate Innovator Beta Project</button>
      </div>
      <div id="liteStatus" class="lite-status"></div>
      <div id="liteError" class="lite-error" hidden></div>
    </section>

    <div id="liteOutput"></div>
    <div id="liteComplete" class="lite-complete">
      Nice work — you completed your Innovator Beta project.
    </div>
  </div>

  <script src="engineering-fields.js"></script>
  <script src="api-config.js"></script>
  <script src="user-plan.js"></script>
  <script src="project-output.js"></script>
  <script src="saved-projects.js"></script>
  <script src="concept-render.js"></script>
  <script src="spark-ai-brand.js"></script>
  <script src="spark-helper.js" defer></script>
  <script>
    (function () {
      var API_BASE = window.ENGINUITY_API_BASE || "https://enginuity-cpl1.onrender.com";
      var COMPLETED_KEY = "innovator_lite_completed";
      var HAS_STARTED_KEY = "has_started";
      var MODE = "Innovator Beta";
      var LEGACY_MODE = "Innovator Lite";
      var currentProject = null;
      var guestUsedConceptRender = false;
      var guestUsedSparkHelper = false;
      var liteCompletionRecorded = false;

      function isGuest() {
        return !localStorage.getItem("user_email");
      }

      window.MODE = MODE;
      localStorage.setItem("enginuity_mode", MODE);
      function getDifficultyValue() {
        var el = document.getElementById("liteDifficulty");
        return el && el.value ? el.value : "Medium: 4–12 hours";
      }

      function configureLitePageForUser() {
        var guest = isGuest();
        var title = document.getElementById("litePageTitle");
        var sub = document.getElementById("litePageSub");
        var diffWrap = document.getElementById("liteDifficultyWrap");
        var btn = document.getElementById("liteGenerateBtn");
        if (guest) {
          if (title) title.textContent = "Enginuity Beta · Quick Intro";
          if (sub) {
            sub.textContent =
              "15–20 minute welcome build using items around you. Sign in after to unlock Innovator Beta projects up to 2 days.";
          }
          if (diffWrap) diffWrap.style.display = "none";
          if (btn) btn.textContent = "Generate Intro Project";
        } else {
          if (title) title.textContent = "Enginuity Beta · Innovator Beta";
          if (sub) {
            sub.textContent =
              "One substantial project per Beta tester — multi-part builds, Concept Render, and SparkHelper. Projects can run up to 2 days. Full Innovator mode launches later.";
          }
          if (diffWrap) diffWrap.style.display = "block";
          if (btn) btn.textContent = "Generate Innovator Beta Project";
        }
      }

      window.ENGINUITY_DONE_REDIRECT = isGuest() ? "sign-in.html" : "index.html";

      configureLitePageForUser();

      if (typeof window.populateEducationSelect === "function") {
        window.populateEducationSelect(document.getElementById("liteEducation"), "high");
      }
      if (typeof window.populateEngineeringFieldSelect === "function") {
        window.populateEngineeringFieldSelect(document.getElementById("liteField"), "");
      }

      window.canUseConceptRender = function () { return { allowed: true }; };
      window.recordConceptRenderUse = function () {
        guestUsedConceptRender = true;
        if (window.ProjectOutput) window.ProjectOutput.updateDoneBarState();
      };
      window.canUseDiagram = window.canUseConceptRender;
      window.recordDiagramUse = window.recordConceptRenderUse;
      window.canUseSparkHelper = function () { return { allowed: true }; };
      window.recordSparkHelperUse = function () {
        guestUsedSparkHelper = true;
        if (window.ProjectOutput) window.ProjectOutput.updateDoneBarState();
      };

      window.enginuityDoneGate = function () {
        if (!currentProject || !window.ProjectOutput) return false;
        var steps = Array.isArray(currentProject.steps) ? currentProject.steps.length : 0;
        if (!steps) return false;
        var id = currentProject.id || "";
        if (!window.ProjectOutput.allStepsComplete(id, steps)) return false;
        if (!isGuest()) return true;
        return guestUsedConceptRender || guestUsedSparkHelper;
      };

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;")
          .replaceAll("'", "&#39;");
      }

      function formatScienceHtml(value) {
        if (window.ProjectOutput && typeof window.ProjectOutput.formatExplanationHtml === "function") {
          return window.ProjectOutput.formatExplanationHtml(value, { escapeHtml: escapeHtml });
        }
        return escapeHtml(String(value || ""));
      }

      function getEducationValue() {
        var el = document.getElementById("liteEducation");
        return el && el.value ? el.value : "high";
      }

      function getEngineeringField() {
        var el = document.getElementById("liteField");
        if (!el || typeof window.normalizeEngineeringField !== "function") return "";
        return window.normalizeEngineeringField(el.value);
      }

      function getProjectGoal() {
        var el = document.getElementById("liteGoal");
        return el && el.value ? el.value.trim() : "";
      }

      function getMaterialsList() {
        var raw = document.getElementById("liteMaterials").value || "";
        return raw
          .split(/\n|,/)
          .map(function (m) { return m.trim(); })
          .filter(Boolean);
      }

      function onStepsComplete() {
        var complete = document.getElementById("liteComplete");
        if (complete) complete.style.display = "block";
        if (liteCompletionRecorded) return;
        liteCompletionRecorded = true;
        localStorage.setItem(COMPLETED_KEY, "true");
        if (typeof window.recordInnovatorLiteCompletion === "function" && currentProject) {
          window.recordInnovatorLiteCompletion(
            currentProject.id ? currentProject.id : "lite-default"
          );
        }
      }

      function saveLiteProject() {
        if (!currentProject || typeof window.saveProjectWithMeta !== "function") return;
        var saved = window.saveProjectWithMeta(currentProject, {
          mode: MODE,
          page: "innovator-lite.html"
        });
        if (saved && typeof window.showSavedToast === "function") {
          window.showSavedToast("✅ Project saved!");
        }
      }

      function renderProject(project) {
        currentProject = project;
        liteCompletionRecorded = false;
        var complete = document.getElementById("liteComplete");
        if (complete) complete.style.display = "none";

        if (typeof window.setCurrentProject === "function") {
          window.setCurrentProject(project);
        }
        if (typeof window.syncSparkHelperContext === "function") {
          window.syncSparkHelperContext();
        }

        var output = document.getElementById("liteOutput");
        var extra =
          '<section class="project-output__section"><h3 class="project-output__label">Estimated time</h3><p class="project-output__text">' + escapeHtml(project.estimatedTime || "15-20 minutes") + "</p></section>" +
          '<section class="project-output__section"><h3 class="project-output__label">Difficulty</h3><p class="project-output__text">' + escapeHtml(project.difficulty || "Beginner") + "</p></section>" +
          '<section class="project-output__section"><h3 class="project-output__label">Science behind it</h3><div class="project-output__prose">' + formatScienceHtml(project.scienceExplanation || "Explore why each step works as you build.") + "</div></section>";

        output.innerHTML = window.ProjectOutput.renderStructuredProject(project, {
          escapeHtml: escapeHtml,
          extraSectionsHtml: extra,
          actionsHtml: '<button type="button" id="liteSaveBtn">💾 Save Project</button>'
        });

        var saveBtn = document.getElementById("liteSaveBtn");
        if (saveBtn) saveBtn.addEventListener("click", saveLiteProject);

        window.ProjectOutput.afterStructuredRender(project);

        var btn = document.getElementById("enginuityDoneBtn");
        if (btn) {
          btn.textContent = isGuest() ? "Done — continue to sign in" : "Done — back to home";
        }
        var hint = document.getElementById("enginuityDoneHint");
        if (hint && isGuest() && !window.ProjectOutput.hasCompletedCategory(MODE)) {
          hint.hidden = false;
          hint.textContent =
            "Check off every step, then try at least one Concept Render or SparkHelper question.";
        }
      }

      document.addEventListener("enginuity:project-steps-complete", function () {
        onStepsComplete();
        if (window.ProjectOutput) window.ProjectOutput.updateDoneBarState();
      });

      function normalizeLiteProject(data, materials) {
        var guest = isGuest();
        var steps = Array.isArray(data.steps) ? data.steps.map(String).filter(Boolean) : [];
        if (guest && steps.length > 7) steps = steps.slice(0, 7);
        var difficulty = data.difficulty || (guest ? "Beginner" : "Intermediate");
        var estimated = data.estimated_time || data.estimatedTime || (guest ? "15-20 minutes" : getDifficultyValue());
        return {
          id: "innovator-beta-" + Date.now(),
          title: data.title || "Innovator Beta Project",
          description: data.description || "",
          estimatedTime: estimated,
          difficulty: difficulty,
          materials: Array.isArray(data.materials) && data.materials.length ? data.materials : materials,
          steps: steps,
          buildPhases: data.build_phases || data.buildPhases || null,
          scienceExplanation: data.science_explanation || "",
          mode: MODE,
          page: "innovator-lite.html",
          engineeringField: data.engineering_field || getEngineeringField() || ""
        };
      }

      function setError(msg) {
        var el = document.getElementById("liteError");
        if (!msg) {
          el.hidden = true;
          el.textContent = "";
          return;
        }
        el.hidden = false;
        el.textContent = msg;
      }

      async function generateLiteProject() {
        setError("");
        if (typeof window.canUseInnovatorLite === "function" && !isGuest()) {
          var liteCheck = window.canUseInnovatorLite();
          if (!liteCheck.allowed) {
            setError(liteCheck.message || "Innovator Beta limit reached.");
            return;
          }
        }
        var status = document.getElementById("liteStatus");
        var btn = document.getElementById("liteGenerateBtn");
        var materials = getMaterialsList();
        if (!materials.length) {
          setError("Please add at least one material.");
          return;
        }

        status.innerHTML =
          '<img class="thinking-box__bolt" src="assets/spark-ai-bolt.svg" width="28" height="28" alt="" aria-hidden="true" style="vertical-align:-0.35em;margin-right:0.35rem;" />' +
          'SparkAI is designing your project...';
        btn.disabled = true;
        btn.textContent = "Generating...";

        try {
          var payload = {
            materials: materials,
            education: getEducationValue(),
            tutorial: isGuest(),
            description: getProjectGoal(),
            engineering_field: getEngineeringField()
          };
          if (!isGuest()) {
            payload.difficulty = getDifficultyValue();
          }
          var data = await window.enginuityPostJson("/generate-innovator-lite", payload);
          if (data && data.error) {
            setError(data.error + (data.suggestion ? " " + data.suggestion : ""));
            return;
          }

          var project = normalizeLiteProject(data || {}, materials);
          if (!project.steps.length) {
            setError("Could not generate a valid project. Please try again.");
            return;
          }

          var signedIn = !isGuest();

          if (signedIn && typeof window.recordInnovatorBetaGeneration === "function") {
            window.recordInnovatorBetaGeneration(project.id);
          }

          status.textContent = signedIn
            ? "Innovator Beta project ready. Multi-part build with Concept Render and SparkHelper."
            : "Intro project ready. Follow your steps and try Concept Render or SparkHelper.";
          renderProject(project);
        } catch (err) {
          setError("Request failed: " + (err && err.message ? err.message : String(err)));
        } finally {
          btn.disabled = false;
          btn.textContent = isGuest() ? "Generate Intro Project" : "Generate Innovator Beta Project";
        }
      }

      document.getElementById("liteGenerateBtn").addEventListener("click", generateLiteProject);

      document.addEventListener("click", function (e) {
        if (e.target && e.target.id === "enginuityDoneBtn" && !e.target.disabled) {
          localStorage.setItem(HAS_STARTED_KEY, "true");
          localStorage.setItem(COMPLETED_KEY, "true");
        }
      }, true);
    })();
  </script>
  <script src="contact.js" defer></script>
  <script src="beta-feedback.js" defer></script>
  <script src="enginuity-loading-screen.js" defer></script>
</body>
</html>
