<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Enginuity · Innovator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="enginuity.css" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="alternate icon" href="assets/logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 24px;
            margin: 0;
            color: #111;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 12px;
            color: #111;
            text-decoration: none;
            font-weight: 600;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 34px;
        }

        .subtitle {
            margin: 0 0 22px;
            color: #333;
            max-width: 720px;
            line-height: 1.4;
        }

        .generator {
            border: 1px solid #e6e6e6;
            border-radius: 14px;
            background: #fafafa;
            padding: 16px;
            margin-bottom: 14px;
        }

        .generator h2 {
            margin: 0 0 14px;
            font-size: 18px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: 700;
            color: #222;
        }

        textarea, select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #d9d9d9;
            font-size: 14px;
            background: #fff;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .actions {
            margin-top: 14px;
        }

        button {
            border: none;
            padding: 12px 14px;
            border-radius: 12px;
            background: #111;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.95;
        }

        .error {
            border: 1px solid #ffb3b3;
            background: #fff0f0;
            color: #8a0000;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .chat {
            border: 1px solid #e6e6e6;
            border-radius: 14px;
            background: #fafafa;
            padding: 16px;
            margin-top: 18px;
        }

        .chat h2 {
            margin: 0 0 12px;
            font-size: 18px;
        }

        .chat-messages {
            border: 1px solid #e9e9e9;
            background: #fff;
            border-radius: 12px;
            height: 320px;
            overflow: auto;
            padding: 12px;
            margin-bottom: 12px;
        }

        .chat-row {
            margin: 10px 0;
            display: flex;
        }

        .chat-row.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 80%;
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid #ededed;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
        }

        .chat-row.user .bubble {
            background: #111;
            color: #fff;
            border-color: #111;
        }

        .chat-row.assistant .bubble {
            background: #fcfcfc;
        }

        .chat-compose {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .chat-input {
            flex: 1;
            min-height: 54px;
            resize: vertical;
        }

        .thinking {
            margin-top: 10px;
            font-size: 13px;
            color: #555;
        }

        @media (max-width: 768px) {
    body {
        padding: 12px;
    }

    h1 {
        font-size: 24px;
    }

    .mode-grid {
        grid-template-columns: 1fr;
    }
    button {
        width: 100%;
    }
}
    </style>
</head>
<body class="enginuity-paper">
    <div class="container">
        <a class="back" href="index.html">← Back</a>

        <h1>Enginuity · Innovator</h1>
        <p class="subtitle">
            You lead the project—SparkAI acts as a technical assistant for open-ended builds.
        </p>

        <div class="generator">
            <h2>Chat Preferences</h2>

            <label for="engineeringField">Field of engineering you are most interested in</label>
            <select id="engineeringField">
                <option value="">Select a field (optional)</option>
                <option value="Mechanical Engineering⚙️">Mechanical Engineering</option>
                <option value="Electrical Engineering⚡">Electrical Engineering</option>
                <option value="Civil Engineering🏗️">Civil Engineering</option>
                <option value="Aerospace Engineering✈️">Aerospace Engineering</option>
                <option value="AI and Software Engineering💻">AI and Software Engineering</option>
                <option value="Other">Other</option>
            </select>

            <label for="education">Education / age</label>
            <select id="education" onchange="updateDifficulty()">
                <option value="middle">Middle-Schooler (10–14)</option>
                <option value="high">High-Schooler (15–18)</option>
                <option value="student">Student (18–25)</option>
                <option value="adult">Adult (25+)</option>
            </select>
            <input type="hidden" id="age" value="" />

            <label for="difficulty">Difficulty (estimated time)</label>
            <select id="difficulty"></select>
        </div>

        <div class="chat" id="chatPanel">
            <h2>Chat (Innovator Mode)</h2>
            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-compose">
                <textarea id="chatInput" class="chat-input" placeholder="Ask SparkAI for help. For example: 'Help me choose a sensor and design the steps.'" ></textarea>
                <button id="sendBtn" style="height: 54px;">Send</button>
                <button id="saveSessionBtn" style="height: 54px;">Save Session</button>
            </div>
            <div id="chatThinking" class="thinking" style="display:none;">SparkAI is thinking...</div>
            <div class="footer-note" id="chatHint" style="margin-top: 10px;">
                Tip: set your preferences above, then chat naturally and iterate your build with SparkAI.
            </div>
        </div>
    </div>

    <script>
        const MODE = "Innovator";
        localStorage.setItem("enginuity_mode", MODE);

        // -------------------------
        // Chat state
        // -------------------------
        let chatHistory = []; // { role: 'user'|'assistant', content: string }
        let lastSelectedProjectName = "";

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll("\"", "&quot;")
                .replaceAll("'", "&#39;");
        }

        function nlToBr(escaped) {
            return escaped.replace(/\n/g, "<br>");
        }

        function extractBalancedJsonSubstring(s) {
            const t = String(s).trim();
            if (!t.length) return null;
            const firstObj = t.indexOf("{");
            const firstArr = t.indexOf("[");
            let i0 = -1;
            if (firstObj === -1) i0 = firstArr;
            else if (firstArr === -1) i0 = firstObj;
            else i0 = Math.min(firstObj, firstArr);
            if (i0 === -1) return null;

            const stack = [];
            let inString = false;
            let escape = false;
            for (let i = i0; i < t.length; i++) {
                const ch = t[i];
                if (inString) {
                    if (escape) {
                        escape = false;
                        continue;
                    }
                    if (ch === "\\") {
                        escape = true;
                        continue;
                    }
                    if (ch === '"') inString = false;
                    continue;
                }
                if (ch === '"') {
                    inString = true;
                    continue;
                }
                if (ch === "{") {
                    stack.push("}");
                    continue;
                }
                if (ch === "[") {
                    stack.push("]");
                    continue;
                }
                if (ch === "}" || ch === "]") {
                    if (!stack.length || ch !== stack[stack.length - 1]) continue;
                    stack.pop();
                    if (!stack.length) return t.slice(i0, i + 1);
                }
            }
            return null;
        }

        function explanationToText(value) {
            if (value == null || value === "") return "";

            if (typeof value === "string") {
                const trimmed = value.trim();
                const withoutFence = trimmed
                    .replace(/^```(?:json)?\s*/i, "")
                    .replace(/```$/i, "")
                    .trim();
                let jsonLike = null;
                if ((withoutFence.startsWith("{") && withoutFence.endsWith("}")) || (withoutFence.startsWith("[") && withoutFence.endsWith("]"))) {
                    jsonLike = withoutFence;
                } else {
                    jsonLike = extractBalancedJsonSubstring(withoutFence);
                }

                if (jsonLike) {
                    try {
                        return explanationToText(JSON.parse(jsonLike));
                    } catch (_) {
                        return withoutFence || value;
                    }
                }
                return withoutFence || value;
            }

            if (Array.isArray(value)) {
                return value.map((item) => explanationToText(item)).join("\n");
            }

            if (typeof value === "object") {
                const preferredKeys = ["reply", "message", "response", "answer", "content", "explanation", "physics_explanation", "physicsExplanation", "engineering_explanation", "engineeringExplanation", "text", "summary"];
                for (const key of preferredKeys) {
                    if (Object.prototype.hasOwnProperty.call(value, key) && value[key]) {
                        return explanationToText(value[key]);
                    }
                }
                const lines = [];
                Object.entries(value).forEach(([key, val]) => {
                    if (val == null || val === "") return;
                    const label = key
                        .replace(/_/g, " ")
                        .replace(/([a-z])([A-Z])/g, "$1 $2")
                        .replace(/\s+/g, " ")
                        .trim()
                        .replace(/^./, (c) => c.toUpperCase());
                    lines.push(`${label}: ${explanationToText(val)}`);
                });
                if (lines.length) return lines.join("\n\n");
                try {
                    return JSON.stringify(value, null, 2);
                } catch (_) {
                    return String(value);
                }
            }

            return String(value);
        }

        function stripDisplayMathDelimiters(text) {
            let t = String(text);
            t = t.replace(/([0-9A-Za-z]+)\$\$\$\$+([0-9A-Za-z]+)/g, "$1 $2");
            while (t.includes("$$$$")) {
                t = t.replace(/\$\$\$\$/g, "$$");
            }
            t = t.replace(/\$\$\s*([\s\S]*?)\s*\$\$/g, "\n$1\n");
            t = t.replace(/(?<=[0-9A-Za-z])\$\$(?=[0-9A-Za-z])/g, " ");
            t = t.replace(/\$\$/g, "");
            return t;
        }

        function formatAssistantText(rawText) {
            const normalized = stripDisplayMathDelimiters(explanationToText(rawText));
            const latexCleaned = normalized
                .replace(/\\\[\s*/g, "\n")
                .replace(/\s*\\\]/g, "\n")
                .replace(/\\text\{([^}]*)\}/g, "$1")
                .replace(/\\rightarrow/g, " -> ")
                .replace(/\\,/g, " ")
                .replace(/\{([^}]*)\}/g, "$1")
                .replace(/\s{2,}/g, " ")
                .trim();
            const escaped = escapeHtml(latexCleaned);
            const withBold = escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
            const withSubscripts = withBold.replace(/_([0-9]+)/g, "<sub>$1</sub>");
            const normalizedMarkdown = withSubscripts
                .replace(/^#{1,6}\s*(.+)$/gm, "<strong>$1</strong>")
                .replace(/^\s*[-*]\s+/gm, "• ")
                .replace(/^\s*>\s?/gm, "");
            return nlToBr(normalizedMarkdown);
        }

        function getEducationLabel() {
            const education = document.getElementById("education").value;
            const labels = {
                middle: "Middle-Schooler(10-14 years old)🖍️",
                high: "High-Schooler(15-18 years old)🏫",
                student: "Student(18-25 years old)🎓",
                adult: "Adult"
            };
            return labels[education] || null;
        }

        function buildChatContext() {
            const materialsEl = document.getElementById("materials");
            const materials = materialsEl ? materialsEl.value.trim() : "";
            const difficulty = document.getElementById("difficulty").value;
            const age = document.getElementById("age").value;
            const engineeringField = document.getElementById("engineeringField").value;
            const parts = [
                `Mode: ${MODE}`,
                lastSelectedProjectName ? `Selected project: ${lastSelectedProjectName}` : null,
                materials ? `Materials: ${materials}` : null,
                difficulty ? `Difficulty: ${difficulty}` : null,
                age ? `Age: ${age}` : null,
                engineeringField ? `Engineering field focus: ${engineeringField}` : null
            ].filter(Boolean);

            return parts.join("\n");
        }

        function appendChatMessage(role, text) {
            const messagesEl = document.getElementById("chatMessages");
            const row = document.createElement("div");
            row.className = `chat-row ${role}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            if (role === "assistant") {
                bubble.innerHTML = formatAssistantText(text);
            } else {
                bubble.textContent = text;
            }

            row.appendChild(bubble);
            messagesEl.appendChild(row);

            // Scroll to bottom after render.
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        
        function saveSession() {
            if (typeof window.saveProjectWithMeta !== "function") {
                alert("Save service is unavailable.");
                return;
            }

            const engineeringField = document.getElementById("engineeringField").value;
            const difficulty = document.getElementById("difficulty").value;
            const age = document.getElementById("age").value;
            const summary = chatHistory.length
                ? "Saved Innovator session with your chat history."
                : "Saved Innovator session with your current preferences.";

            const project = {
                title: lastSelectedProjectName || "Innovator Session",
                description: summary,
                materials: [],
                steps: chatHistory.map((entry) => `${entry.role.toUpperCase()}: ${entry.content}`),
                engineeringExplanation: `Field: ${engineeringField || "Not set"}`,
                physicsExplanation: `Difficulty: ${difficulty || "Not set"} | Age: ${age || "Not set"}`
            };

            const saved = window.saveProjectWithMeta(project, {
                mode: MODE,
                page: "innovator.html"
            });
            if (saved && typeof window.showSavedToast === "function") {
                window.showSavedToast("✅ Session saved!");
            }
        }

        function resumeSavedProjectIfAny() {
            if (typeof window.consumeResumeProject !== "function") return;
            const saved = window.consumeResumeProject();
            if (!saved) return;
            if (saved.page && saved.page !== "innovator.html") return;
            hydrateChatFromSaved(saved);
        }

        function hydrateChatFromSaved(saved) {
            if (!saved || !Array.isArray(saved.steps) || !saved.steps.length) return;
            chatHistory = [];
            document.getElementById("chatMessages").innerHTML = "";
            if (saved.title) {
                lastSelectedProjectName = saved.title;
            }
            saved.steps.forEach((line) => {
                if (typeof line !== "string") return;
                if (line.startsWith("USER: ")) {
                    const text = line.slice(6);
                    chatHistory.push({ role: "user", content: text });
                    appendChatMessage("user", text);
                } else if (line.startsWith("ASSISTANT: ")) {
                    const text = line.slice(11);
                    chatHistory.push({ role: "assistant", content: text });
                    appendChatMessage("assistant", text);
                }
            });
        }

        function renderSavedProject(project) {
            hydrateChatFromSaved(project);
        }

        window.renderSavedProject = renderSavedProject;

        function updateDifficulty() {
            const education = document.getElementById("education").value;
            const difficulty = document.getElementById("difficulty");
            const ageHidden = document.getElementById("age");

            let options = [];
            let ageValue = "";

            if (education === "middle") {
                options = ["Easy: 5–10 min", "Medium: 15–30 min", "Hard: 30–45 min"];
                ageValue = "10-14";
            } else if (education === "high") {
                options = ["Easy: 8–20 min", "Medium: 30–50 min", "Hard: 50–75 min"];
                ageValue = "15-18";
            } else if (education === "student") {
                options = ["Easy: 20–45 min", "Medium: 45–90 min", "Hard: 90–150 min"];
                ageValue = "18-25";
            } else {
                options = ["Easy: 25–50 min", "Medium: 50–120 min", "Hard: 2–4 days"];
                ageValue = "25+";
            }

            ageHidden.value = ageValue;
            difficulty.innerHTML = options.map(o => `<option>${o}</option>`).join("");
        }

        async function sendMessage() {
            const inputEl = document.getElementById("chatInput");
            const userText = inputEl.value.trim();
            if (!userText) return;

            // Optimistically render user message.
            appendChatMessage("user", userText);
            chatHistory.push({ role: "user", content: userText });
            inputEl.value = "";

            const sendBtn = document.getElementById("sendBtn");
            const chatThinking = document.getElementById("chatThinking");
            sendBtn.disabled = true;
            sendBtn.textContent = "Sending...";
            chatThinking.style.display = "block";
            const thinkingSteps = [
                "SparkAI is thinking...",
                "Reviewing your project context...",
                "Composing response..."
            ];
            let thinkingIdx = 0;
            chatThinking.textContent = thinkingSteps[thinkingIdx];
            const thinkingTimer = setInterval(() => {
                thinkingIdx = (thinkingIdx + 1) % thinkingSteps.length;
                chatThinking.textContent = thinkingSteps[thinkingIdx];
            }, 900);

            // Add context into the message (backend does not have a separate memory field).
            const context = buildChatContext();
            const messageToSend = context ? `${context}\n\n${userText}` : userText;

            try {
                const response = await fetch("https://enginuity-cpl1.onrender.com/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: messageToSend,
                        mode: MODE,
                        history: chatHistory,
                        education: getEducationLabel()
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                const data = await response.json();
                function pickChatReply(d) {
                    if (!d || typeof d !== "object") return "";
                    const keys = ["reply", "message", "response", "answer", "text", "content"];
                    for (const k of keys) {
                        if (!Object.prototype.hasOwnProperty.call(d, k)) continue;
                        const v = d[k];
                        if (v == null || v === "") continue;
                        if (typeof v === "string" && !v.trim()) continue;
                        return v;
                    }
                    return "";
                }
                let replyPayload = pickChatReply(data);
                if (!replyPayload && data && data.error) {
                    replyPayload = typeof data.error === "string" ? data.error : JSON.stringify(data.error);
                }
                let replyText =
                    typeof replyPayload === "object"
                        ? explanationToText(replyPayload)
                        : typeof replyPayload === "string"
                          ? explanationToText(replyPayload)
                          : replyPayload != null
                            ? String(replyPayload)
                            : "";
                replyText = String(replyText || "").trim();

                if (!replyText) {
                    appendChatMessage("assistant", "Sorry, I couldn't generate a reply. Please try again.");
                    return;
                }

                appendChatMessage("assistant", replyText);

                chatHistory.push({ role: "assistant", content: replyText });
            } catch (e) {
                appendChatMessage("assistant", `Request failed: ${e && e.message ? e.message : String(e)}`);
            } finally {
                clearInterval(thinkingTimer);
                sendBtn.disabled = false;
                sendBtn.textContent = "Send";
                chatThinking.style.display = "none";
                chatThinking.textContent = "SparkAI is thinking...";
            }
        }

        // Wire up chat events.
        document.getElementById("sendBtn").addEventListener("click", sendMessage);
        document.getElementById("saveSessionBtn").addEventListener("click", saveSession);
        document.getElementById("chatInput").addEventListener("keydown", (e) => {
            // Enter to send, Shift+Enter to add newline.
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        updateDifficulty();

        // Initial assistant nudge (no backend call).
        appendChatMessage(
            "assistant",
            "Hi! I'm SparkAI in Innovator mode. You lead the build—tell me your next decision (materials, design, steps) and I'll help you refine it."
        );
        resumeSavedProjectIfAny();
    </script>
    <script src="saved-projects.js" defer></script>
    <script src="enginuity-loading-screen.js" defer></script>
</body>
</html>
