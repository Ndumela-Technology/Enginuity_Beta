<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Enginuity Beta · Innovator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />
    <script src="enginuity-theme.js"></script>
  <link rel="stylesheet" href="enginuity.css" />
    <link rel="stylesheet" href="spark-helper.css" />
    <link rel="stylesheet" href="upgrade.css" />
    <link rel="stylesheet" href="project-output.css" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="alternate icon" href="assets/logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body class="enginuity-paper">
    <div class="container">
        <a class="back" href="index.html">← Back</a>

        <h1>Enginuity Beta · Innovator</h1>
        <p class="subtitle">
            You lead the project—SparkAI acts as a technical assistant for open-ended builds.
        </p>

        <div class="generator">
            <h2>Chat Preferences</h2>

            <label for="engineeringField">Field of engineering you are most interested in</label>
            <select id="engineeringField"></select>

            <label for="education">Education / age</label>
            <select id="education" onchange="updateAgeFromEducation()"></select>
            <input type="hidden" id="age" value="" />
        </div>

        <div id="innovatorUsageBanner" class="innovator-usage-banner" role="status" aria-live="polite"></div>

        <div class="chat" id="chatPanel">
            <h2>Chat (Innovator Mode)</h2>
            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-compose">
                <textarea id="chatInput" class="chat-input" placeholder="Ask SparkAI for help. For example: 'Help me choose a sensor and design the steps.'" ></textarea>
                <button id="sendBtn" style="height: 54px;">Send</button>
                <button id="saveSessionBtn" style="height: 54px;">Save Session</button>
            </div>
            <div id="chatThinking" class="thinking" style="display:none;">SparkAI is thinking...</div>
            <div class="footer-note" id="chatHint" style="margin-top: 10px;">
                Tip: set your preferences above, then chat naturally and iterate your build with SparkAI.
            </div>
        </div>
    </div>

    <script src="engineering-fields.js"></script>
    <script src="api-config.js"></script>
    <script src="user-plan.js"></script>
    <script src="project-output.js"></script>
    <script>
        const MODE = "Innovator";
        window.MODE = MODE;
        const API_BASE = window.ENGINUITY_API_BASE || "https://enginuity-cpl1.onrender.com";
        localStorage.setItem("enginuity_mode", MODE);

        // -------------------------
        // Chat state
        // -------------------------
        let chatHistory = []; // { role: 'user'|'assistant', content: string }
        let lastSelectedProjectName = "";

        function refreshInnovatorUsageUi() {
            const banner = document.getElementById("innovatorUsageBanner");
            const sendBtn = document.getElementById("sendBtn");
            const inputEl = document.getElementById("chatInput");
            if (typeof window.getInnovatorMonthlyStatus !== "function") {
                return;
            }
            const status = window.getInnovatorMonthlyStatus();
            if (banner) {
                if (status.unlimited) {
                    banner.classList.remove("is-visible");
                    banner.textContent = "";
                } else if (status.max != null) {
                    banner.classList.add("is-visible");
                    banner.innerHTML =
                        "<strong>Innovator usage:</strong> " +
                        status.remaining +
                        " of " +
                        status.max +
                        " left this month. " +
                        (status.resetLabel || "Resets monthly") +
                        ".";
                } else {
                    banner.classList.remove("is-visible");
                }
            }
            const check =
                typeof window.canUseInnovator === "function"
                    ? window.canUseInnovator()
                    : { allowed: true };
            const blocked = !check.allowed;
            if (sendBtn) sendBtn.disabled = blocked;
            if (inputEl) {
                inputEl.disabled = blocked;
                inputEl.placeholder = blocked
                    ? "Monthly Innovator limit reached — upgrade to Pro for unlimited access."
                    : "Ask SparkAI for help. For example: 'Help me choose a sensor and design the steps.'";
            }
        }

        function applyInnovatorAccessGate() {
            if (typeof window.canUseInnovator !== "function") {
                return;
            }
            const check = window.canUseInnovator();
            if (!check.allowed) {
                const panel = document.getElementById("chatPanel");
                if (panel && !document.getElementById("innovatorAccessNotice")) {
                    const notice = document.createElement("div");
                    notice.className = "error";
                    notice.id = "innovatorAccessNotice";
                    notice.textContent =
                        check.message || "Innovator access is not available on your plan.";
                    panel.parentNode.insertBefore(notice, panel);
                }
            }
            refreshInnovatorUsageUi();
        }

        document.addEventListener("enginuity:usage-changed", refreshInnovatorUsageUi);
        document.addEventListener("enginuity:plan-changed", refreshInnovatorUsageUi);

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll("\"", "&quot;")
                .replaceAll("'", "&#39;");
        }

        function nlToBr(escaped) {
            return escaped.replace(/\n/g, "<br>");
        }

        function extractBalancedJsonSubstring(s) {
            const t = String(s).trim();
            if (!t.length) return null;
            const firstObj = t.indexOf("{");
            const firstArr = t.indexOf("[");
            let i0 = -1;
            if (firstObj === -1) i0 = firstArr;
            else if (firstArr === -1) i0 = firstObj;
            else i0 = Math.min(firstObj, firstArr);
            if (i0 === -1) return null;

            const stack = [];
            let inString = false;
            let escape = false;
            for (let i = i0; i < t.length; i++) {
                const ch = t[i];
                if (inString) {
                    if (escape) {
                        escape = false;
                        continue;
                    }
                    if (ch === "\\") {
                        escape = true;
                        continue;
                    }
                    if (ch === '"') inString = false;
                    continue;
                }
                if (ch === '"') {
                    inString = true;
                    continue;
                }
                if (ch === "{") {
                    stack.push("}");
                    continue;
                }
                if (ch === "[") {
                    stack.push("]");
                    continue;
                }
                if (ch === "}" || ch === "]") {
                    if (!stack.length || ch !== stack[stack.length - 1]) continue;
                    stack.pop();
                    if (!stack.length) return t.slice(i0, i + 1);
                }
            }
            return null;
        }

        function explanationToText(value) {
            if (value == null || value === "") return "";

            if (typeof value === "string") {
                const trimmed = value.trim();
                const withoutFence = trimmed
                    .replace(/^```(?:json)?\s*/i, "")
                    .replace(/```$/i, "")
                    .trim();
                let jsonLike = null;
                if ((withoutFence.startsWith("{") && withoutFence.endsWith("}")) || (withoutFence.startsWith("[") && withoutFence.endsWith("]"))) {
                    jsonLike = withoutFence;
                } else {
                    jsonLike = extractBalancedJsonSubstring(withoutFence);
                }

                if (jsonLike) {
                    try {
                        return explanationToText(JSON.parse(jsonLike));
                    } catch (_) {
                        return withoutFence || value;
                    }
                }
                return withoutFence || value;
            }

            if (Array.isArray(value)) {
                return value.map((item) => explanationToText(item)).join("\n");
            }

            if (typeof value === "object") {
                const preferredKeys = ["reply", "message", "response", "answer", "content", "explanation", "physics_explanation", "physicsExplanation", "engineering_explanation", "engineeringExplanation", "text", "summary"];
                for (const key of preferredKeys) {
                    if (Object.prototype.hasOwnProperty.call(value, key) && value[key]) {
                        return explanationToText(value[key]);
                    }
                }
                const lines = [];
                Object.entries(value).forEach(([key, val]) => {
                    if (val == null || val === "") return;
                    const label = key
                        .replace(/_/g, " ")
                        .replace(/([a-z])([A-Z])/g, "$1 $2")
                        .replace(/\s+/g, " ")
                        .trim()
                        .replace(/^./, (c) => c.toUpperCase());
                    lines.push(`${label}: ${explanationToText(val)}`);
                });
                if (lines.length) return lines.join("\n\n");
                try {
                    return JSON.stringify(value, null, 2);
                } catch (_) {
                    return String(value);
                }
            }

            return String(value);
        }

        function stripDisplayMathDelimiters(text) {
            let t = String(text);
            t = t.replace(/([0-9A-Za-z]+)\$\$\$\$+([0-9A-Za-z]+)/g, "$1 $2");
            while (t.includes("$$$$")) {
                t = t.replace(/\$\$\$\$/g, "$$");
            }
            t = t.replace(/\$\$\s*([\s\S]*?)\s*\$\$/g, "\n$1\n");
            t = t.replace(/(?<=[0-9A-Za-z])\$\$(?=[0-9A-Za-z])/g, " ");
            t = t.replace(/\$\$/g, "");
            return t;
        }

        function formatAssistantText(rawText) {
            const normalized = stripDisplayMathDelimiters(explanationToText(rawText));
            const latexCleaned = normalized
                .replace(/\\\[\s*/g, "\n")
                .replace(/\s*\\\]/g, "\n")
                .replace(/\\text\{([^}]*)\}/g, "$1")
                .replace(/\\rightarrow/g, " -> ")
                .replace(/\\,/g, " ")
                .replace(/\{([^}]*)\}/g, "$1")
                .replace(/\s{2,}/g, " ")
                .trim();
            const escaped = escapeHtml(latexCleaned);
            const withBold = escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
            const withSubscripts = withBold.replace(/_([0-9]+)/g, "<sub>$1</sub>");
            const normalizedMarkdown = withSubscripts
                .replace(/^#{1,6}\s*(.+)$/gm, "<strong>$1</strong>")
                .replace(/^\s*[-*]\s+/gm, "• ")
                .replace(/^\s*>\s?/gm, "");
            return nlToBr(normalizedMarkdown);
        }

        function getEducationLabel() {
            const education = document.getElementById("education").value;
            const labels = {
                middle: "Middle-Schooler(10-14 years old)🖍️",
                high: "High-Schooler(15-18 years old)🏫",
                student: "Student(18-25 years old)🎓"
            };
            return labels[education] || null;
        }

        function getSelectedEngineeringField() {
            const el = document.getElementById("engineeringField");
            const raw = el ? el.value : "";
            return typeof window.normalizeEngineeringField === "function"
                ? window.normalizeEngineeringField(raw)
                : String(raw || "").trim();
        }

        function buildInnovatorContext() {
            const age = document.getElementById("age").value;
            const engineeringField = getSelectedEngineeringField();
            const fieldLine = typeof window.engineeringFieldFocusLine === "function"
                ? window.engineeringFieldFocusLine(engineeringField)
                : (engineeringField ? `Engineering field focus: ${engineeringField}` : "");
            const parts = [
                `Mode: ${MODE}`,
                age ? `Age group: ${age}` : null,
                fieldLine || null
            ].filter(Boolean);

            if (typeof window.getCurrentProject === "function") {
                const proj = window.getCurrentProject();
                if (proj) {
                    lastSelectedProjectName = proj.title || lastSelectedProjectName;
                    if (typeof window.buildSparkProjectContext === "function") {
                        parts.push(window.buildSparkProjectContext(proj));
                    } else {
                        parts.push("Current project: " + (proj.title || "Untitled"));
                        if (proj.description) parts.push("Description: " + proj.description);
                    }
                } else if (lastSelectedProjectName) {
                    parts.push(`Selected project: ${lastSelectedProjectName}`);
                }
            } else if (lastSelectedProjectName) {
                parts.push(`Selected project: ${lastSelectedProjectName}`);
            }

            return parts.join("\n");
        }

        function parseChatResponse(data) {
            if (!data || typeof data !== "object") return { reply: "", error: "Invalid response from server." };
            if (data.error) {
                return {
                    reply: "",
                    error: typeof data.error === "string" ? data.error : "Something went wrong."
                };
            }
            const reply = typeof data.reply === "string" ? data.reply.trim() : "";
            return { reply, error: reply ? "" : "Empty reply from server." };
        }

        function appendChatMessage(role, text) {
            const messagesEl = document.getElementById("chatMessages");
            const row = document.createElement("div");
            row.className = `chat-row ${role}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            if (role === "assistant") {
                bubble.innerHTML = formatAssistantText(text);
            } else {
                bubble.textContent = text;
            }

            row.appendChild(bubble);
            messagesEl.appendChild(row);

            // Scroll to bottom after render.
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        
        function saveSession() {
            if (typeof window.saveProjectWithMeta !== "function") {
                alert("Save service is unavailable.");
                return;
            }

            const engineeringField = document.getElementById("engineeringField").value;
            const age = document.getElementById("age").value;
            const summary = chatHistory.length
                ? "Saved Innovator session with your chat history."
                : "Saved Innovator session with your current preferences.";

            const project = {
                title: lastSelectedProjectName || "Innovator Session",
                description: summary,
                materials: [],
                steps: chatHistory.map((entry) => `${entry.role.toUpperCase()}: ${entry.content}`),
                engineeringExplanation: `Field: ${engineeringField || "Not set"}`,
                physicsExplanation: `Age: ${age || "Not set"}`
            };

            const saved = window.saveProjectWithMeta(project, {
                mode: MODE,
                page: "innovator.html"
            });
            if (saved && typeof window.showSavedToast === "function") {
                window.showSavedToast("✅ Session saved!");
            }
        }

        function resumeSavedProjectIfAny() {
            if (typeof window.consumeResumeProject !== "function") return;
            const saved = window.consumeResumeProject();
            if (!saved) return;
            if (saved.page && saved.page !== "innovator.html") return;
            hydrateChatFromSaved(saved);
        }

        function hydrateChatFromSaved(saved) {
            if (!saved || !Array.isArray(saved.steps) || !saved.steps.length) return;
            chatHistory = [];
            document.getElementById("chatMessages").innerHTML = "";
            if (saved.title) {
                lastSelectedProjectName = saved.title;
            }
            saved.steps.forEach((line) => {
                if (typeof line !== "string") return;
                if (line.startsWith("USER: ")) {
                    const text = line.slice(6);
                    chatHistory.push({ role: "user", content: text });
                    appendChatMessage("user", text);
                } else if (line.startsWith("ASSISTANT: ")) {
                    const text = line.slice(11);
                    chatHistory.push({ role: "assistant", content: text });
                    appendChatMessage("assistant", text);
                }
            });
        }

        function renderSavedProject(project) {
            hydrateChatFromSaved(project);
        }

        window.renderSavedProject = renderSavedProject;

        function updateAgeFromEducation() {
            const education = document.getElementById("education").value;
            const ageHidden = document.getElementById("age");
            ageHidden.value = typeof window.ageForEducation === "function"
                ? window.ageForEducation(education)
                : "15-18";
        }

        async function sendMessage() {
            const inputEl = document.getElementById("chatInput");
            const userText = inputEl.value.trim();
            if (!userText) return;

            if (typeof window.canUseInnovator === "function") {
                const innovCheck = window.canUseInnovator();
                if (!innovCheck.allowed) {
                    alert(
                        innovCheck.message ||
                            "You've reached your monthly Innovator limit. Upgrade to Pro for unlimited access."
                    );
                    refreshInnovatorUsageUi();
                    return;
                }
            }

            appendChatMessage("user", userText);
            chatHistory.push({ role: "user", content: userText });
            const historyForApi = chatHistory.slice(0, -1);
            inputEl.value = "";

            const sendBtn = document.getElementById("sendBtn");
            const chatThinking = document.getElementById("chatThinking");
            sendBtn.disabled = true;
            sendBtn.textContent = "Sending...";
            chatThinking.style.display = "block";
            const thinkingSteps = [
                "SparkAI is thinking...",
                "Reviewing your project context...",
                "Composing response..."
            ];
            let thinkingIdx = 0;
            chatThinking.textContent = thinkingSteps[thinkingIdx];
            const thinkingTimer = setInterval(() => {
                thinkingIdx = (thinkingIdx + 1) % thinkingSteps.length;
                chatThinking.textContent = thinkingSteps[thinkingIdx];
            }, 900);

            try {
                const response = await fetch(`${API_BASE}/chat-innovator`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: userText,
                        context: buildInnovatorContext(),
                        history: historyForApi,
                        education: getEducationLabel(),
                        mode: MODE
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                const data = await response.json();
                const parsed = parseChatResponse(data);

                if (parsed.error) {
                    appendChatMessage("assistant", parsed.error);
                    return;
                }

                const replyText = explanationToText(parsed.reply).trim();
                if (!replyText) {
                    appendChatMessage("assistant", "Sorry, I couldn't generate a reply. Please try again.");
                    return;
                }

                appendChatMessage("assistant", replyText);
                chatHistory.push({ role: "assistant", content: replyText });

                if (typeof window.recordInnovatorUse === "function") {
                    window.recordInnovatorUse();
                }
                if (!window.__enginuityInnovatorSessionCounted) {
                    window.__enginuityInnovatorSessionCounted = true;
                    if (typeof window.recordBetaSessionCompleted === "function") {
                        window.recordBetaSessionCompleted("Innovator");
                    }
                }
                refreshInnovatorUsageUi();
            } catch (e) {
                appendChatMessage("assistant", `Request failed: ${e && e.message ? e.message : String(e)}`);
            } finally {
                clearInterval(thinkingTimer);
                sendBtn.disabled = false;
                sendBtn.textContent = "Send";
                chatThinking.style.display = "none";
                chatThinking.textContent = "SparkAI is thinking...";
            }
        }

        // Wire up chat events.
        document.getElementById("sendBtn").addEventListener("click", sendMessage);
        document.getElementById("saveSessionBtn").addEventListener("click", saveSession);
        document.getElementById("chatInput").addEventListener("keydown", (e) => {
            // Enter to send, Shift+Enter to add newline.
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        if (typeof window.populateEngineeringFieldSelect === "function") {
            window.populateEngineeringFieldSelect(document.getElementById("engineeringField"));
        }
        if (typeof window.populateEducationSelect === "function") {
            window.populateEducationSelect(document.getElementById("education"), "high");
        }
        updateAgeFromEducation();

        // Initial assistant nudge (no backend call).
        appendChatMessage(
            "assistant",
            "Hi! I'm SparkAI in Innovator mode. You lead the build—tell me your next decision (materials, design, steps) and I'll help you refine it."
        );
        resumeSavedProjectIfAny();
        applyInnovatorAccessGate();

        if (window.ProjectOutput && typeof window.ProjectOutput.showDoneBarAlways === "function") {
            window.ProjectOutput.showDoneBarAlways({
                label: "Done — back to home",
                onDone: function () {
                    if (window.ProjectOutput.markCategoryComplete) {
                        window.ProjectOutput.markCategoryComplete(MODE);
                    }
                    window.location.href = "index.html";
                }
            });
        }
    </script>
    <script src="upgrade.js"></script>
    <script src="contact.js"></script>
    <script src="beta-feedback.js"></script>
    <script src="saved-projects.js" defer></script>
    <script src="spark-ai-brand.js"></script>
    <script src="spark-helper.js" defer></script>
    <script src="enginuity-loading-screen.js" defer></script>
</body>
</html>
