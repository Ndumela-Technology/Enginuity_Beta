<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Enginuity & SparkAI Ad Export</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ddd;
      padding: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      font-family: "Special Elite", "Courier New", Courier, monospace;
    }

    .ad {
      position: relative;
      overflow: hidden;
      color: #8b1a1a;
      background-color: #f7f3eb;
      background-image:
        linear-gradient(rgba(120, 145, 170, 0.28) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120, 145, 170, 0.28) 1px, transparent 1px),
        linear-gradient(rgba(100, 125, 155, 0.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100, 125, 155, 0.22) 1px, transparent 1px);
      background-size: 28px 28px, 28px 28px, 7px 7px, 7px 7px;
      border: 3px solid rgba(216, 31, 38, 0.42);
      box-shadow: 6px 8px 0 rgba(120, 10, 10, 0.12);
    }

    .ad--landscape { width: 1200px; height: 630px; }
    .ad--square { width: 1080px; height: 1080px; }

    .ad__frame {
      position: absolute;
      inset: 18px;
      border: 2px dashed rgba(216, 31, 38, 0.28);
      pointer-events: none;
    }

    .ad__content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 56px;
    }

    .ad__logo {
      display: block;
      object-fit: contain;
    }

    .ad--enginuity .ad__logo { width: 182px; height: auto; margin-bottom: 18px; }
    .ad--enginuity.ad--square .ad__logo { width: 260px; margin-bottom: 28px; }

    .ad--spark .ad__logo { width: 120px; height: 120px; margin-bottom: 22px; }
    .ad--spark.ad--square .ad__logo { width: 180px; height: 180px; margin-bottom: 32px; }

    .ad__title {
      font-size: 72px;
      line-height: 1.05;
      letter-spacing: 0.04em;
      color: #d81f26;
      text-shadow: 2px 2px 0 rgba(139, 26, 26, 0.12);
    }

    .ad--square .ad__title { font-size: 92px; }

    .ad__tagline {
      margin-top: 16px;
      max-width: 760px;
      font-size: 28px;
      line-height: 1.45;
      color: #8b1a1a;
    }

    .ad--square .ad__tagline {
      font-size: 34px;
      max-width: 820px;
    }

    .ad__accent {
      position: absolute;
      width: 120px;
      height: 120px;
      border: 2px solid rgba(216, 31, 38, 0.18);
      border-radius: 50%;
      opacity: 0.55;
    }

    .ad__accent--tl { top: 36px; left: 36px; }
    .ad__accent--br { right: 42px; bottom: 42px; width: 88px; height: 88px; }

    .ad--spark {
      background-color: #f7f3eb;
    }

    .ad--enginuity .ad__title {
      color: #1a1a1a;
      text-shadow: none;
    }

    .ad--spark .ad__title {
      color: #8b1a1a;
    }
  </style>
</head>
<body>
  <div id="enginuity-landscape" class="ad ad--landscape ad--enginuity">
    <div class="ad__frame"></div>
    <div class="ad__accent ad__accent--tl"></div>
    <div class="ad__accent ad__accent--br"></div>
    <div class="ad__content">
      <img class="ad__logo" src="../logo.svg" alt="" />
      <h1 class="ad__title">Enginuity</h1>
    </div>
  </div>

  <div id="enginuity-square" class="ad ad--square ad--enginuity">
    <div class="ad__frame"></div>
    <div class="ad__accent ad__accent--tl"></div>
    <div class="ad__accent ad__accent--br"></div>
    <div class="ad__content">
      <img class="ad__logo" src="../logo.svg" alt="" />
      <h1 class="ad__title">Enginuity</h1>
    </div>
  </div>

  <div id="sparkai-landscape" class="ad ad--landscape ad--spark">
    <div class="ad__frame"></div>
    <div class="ad__accent ad__accent--tl"></div>
    <div class="ad__accent ad__accent--br"></div>
    <div class="ad__content">
      <img class="ad__logo" src="../spark-ai-bolt.svg" alt="" />
      <h1 class="ad__title">SparkAI</h1>
      <p class="ad__tagline">Intelligent AI for building, learning, and engineering curiosity.</p>
    </div>
  </div>

  <div id="sparkai-square" class="ad ad--square ad--spark">
    <div class="ad__frame"></div>
    <div class="ad__accent ad__accent--tl"></div>
    <div class="ad__accent ad__accent--br"></div>
    <div class="ad__content">
      <img class="ad__logo" src="../spark-ai-bolt.svg" alt="" />
      <h1 class="ad__title">SparkAI</h1>
      <p class="ad__tagline">Powering Enginuity</p>
    </div>
  </div>
</body>
</html>
