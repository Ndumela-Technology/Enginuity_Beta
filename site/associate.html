<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Enginuity · Associate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="enginuity.css" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="alternate icon" href="assets/logo.svg">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 24px;
            margin: 0;
            color: #111;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 12px;
            color: #111;
            text-decoration: none;
            font-weight: 600;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 34px;
        }

        .subtitle {
            margin: 0 0 22px;
            color: #333;
            max-width: 720px;
            line-height: 1.4;
        }

        .generator {
            border: 1px solid #e6e6e6;
            border-radius: 14px;
            background: #fafafa;
            padding: 16px;
            margin-bottom: 14px;
        }

        .generator h2 {
            margin: 0 0 14px;
            font-size: 18px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: 700;
            color: #222;
        }

        textarea, select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #d9d9d9;
            font-size: 14px;
            background: #fff;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .actions {
            margin-top: 14px;
        }

        button {
            border: none;
            padding: 12px 14px;
            border-radius: 12px;
            background: #111;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.95;
        }

        .project {
            border: 1px solid #e6e6e6;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 12px;
            background: #fff;
        }

        .title {
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .section {
            margin-top: 10px;
        }

        .pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 8px 0 0;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 10px;
            background: #fcfcfc;
            font-family: inherit;
            line-height: 1.4;
        }

        .safety {
            border: 1px solid #ffd2a8;
            background: #fff7ef;
            color: #6a3b00;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .error {
            border: 1px solid #ffb3b3;
            background: #fff0f0;
            color: #8a0000;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .thinking-box {
            border: 1px solid #d7d7d7;
            background: #fff;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 12px;
        }

        .thinking-title {
            font-weight: 800;
            margin-bottom: 6px;
        }

        .thinking-step {
            color: #555;
            font-size: 13px;
        }

        .contribution-box {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px dashed #ddd;
        }

        .contribution-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .muted {
            color: #555;
            font-size: 13px;
            margin-top: 6px;
        }
    </style>
</head>
<body class="enginuity-paper">
    <div class="container">
        <a class="back" href="index.html">← Back</a>

        <h1>Enginuity · Associate</h1>
        <p class="subtitle">
            Semi-guided collaboration: SparkAI helps you think, you can modify decisions.
        </p>

        <div class="generator">
            <h2>Spark Associate</h2>

            <label for="engineeringField">Field of engineering you are most interested in</label>
            <select id="engineeringField">
                <option value="">Select a field (optional)</option>
                <option value="Mechanical Engineering⚙️">Mechanical Engineering</option>
                <option value="Electrical Engineering⚡">Electrical Engineering</option>
                <option value="Civil Engineering🏗️">Civil Engineering</option>
                <option value="Aerospace Engineering✈️">Aerospace Engineering</option>
                <option value="AI and Software Engineering💻">AI and Software Engineering</option>
                <option value="Other">Other</option>
            </select>

            <label for="education">Education / age</label>
            <select id="education" onchange="updateDifficulty()">
                <option value="middle">Middle-Schooler (10–14)</option>
                <option value="high">High-Schooler (15–18)</option>
                <option value="student">Student (18–25)</option>
                <option value="adult">Adult (25+)</option>
            </select>
            <input type="hidden" id="age" value="" />

            <label for="difficulty">Difficulty (estimated time)</label>
            <select id="difficulty"></select>

            <label for="materials">What materials do you have?</label>
            <textarea id="materials" placeholder="List what you already have (be as specific as you can)"></textarea>

            <div class="actions">
                <button onclick="generateProject()">Generate Project</button>
            </div>
        </div>

        <hr />
        <div id="output"></div>
        <pre id="rawOutput" class="pre" style="margin-top:12px; display:none;"></pre>
    </div>

    <script>
        const MODE = "Associate";
        localStorage.setItem("enginuity_mode", MODE);
        let selectedProjectIndex = null;

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll("\"", "&quot;")
                .replaceAll("'", "&#39;");
        }

        function nlToBr(escaped) {
            return escaped.replace(/\n/g, "<br>");
        }

        function extractBalancedJsonSubstring(s) {
            const t = String(s).trim();
            if (!t.length) return null;
            const firstObj = t.indexOf("{");
            const firstArr = t.indexOf("[");
            let i0 = -1;
            if (firstObj === -1) i0 = firstArr;
            else if (firstArr === -1) i0 = firstObj;
            else i0 = Math.min(firstObj, firstArr);
            if (i0 === -1) return null;

            const stack = [];
            let inString = false;
            let escape = false;
            for (let i = i0; i < t.length; i++) {
                const ch = t[i];
                if (inString) {
                    if (escape) {
                        escape = false;
                        continue;
                    }
                    if (ch === "\\") {
                        escape = true;
                        continue;
                    }
                    if (ch === '"') inString = false;
                    continue;
                }
                if (ch === '"') {
                    inString = true;
                    continue;
                }
                if (ch === "{") {
                    stack.push("}");
                    continue;
                }
                if (ch === "[") {
                    stack.push("]");
                    continue;
                }
                if (ch === "}" || ch === "]") {
                    if (!stack.length || ch !== stack[stack.length - 1]) continue;
                    stack.pop();
                    if (!stack.length) return t.slice(i0, i + 1);
                }
            }
            return null;
        }

        function explanationToText(value) {
            if (value == null || value === "") return "Not provided.";

            if (typeof value === "string") {
                const trimmed = value.trim();
                const withoutFence = trimmed
                    .replace(/^```(?:json)?\s*/i, "")
                    .replace(/```$/i, "")
                    .trim();
                let jsonLike = null;
                if ((withoutFence.startsWith("{") && withoutFence.endsWith("}")) || (withoutFence.startsWith("[") && withoutFence.endsWith("]"))) {
                    jsonLike = withoutFence;
                } else {
                    jsonLike = extractBalancedJsonSubstring(withoutFence);
                }

                if (jsonLike) {
                    try {
                        return explanationToText(JSON.parse(jsonLike));
                    } catch (_) {
                        return withoutFence || value;
                    }
                }
                return withoutFence || value;
            }

            if (Array.isArray(value)) {
                return value.map((item) => explanationToText(item)).join("\n");
            }

            if (typeof value === "object") {
                const preferredKeys = ["explanation", "physics_explanation", "physicsExplanation", "content", "message", "engineering_explanation", "engineeringExplanation", "text", "summary"];
                for (const key of preferredKeys) {
                    if (Object.prototype.hasOwnProperty.call(value, key) && value[key]) {
                        return explanationToText(value[key]);
                    }
                }
                const lines = [];
                Object.entries(value).forEach(([key, val]) => {
                    if (val == null || val === "") return;
                    const label = key
                        .replace(/_/g, " ")
                        .replace(/([a-z])([A-Z])/g, "$1 $2")
                        .replace(/\s+/g, " ")
                        .trim()
                        .replace(/^./, (c) => c.toUpperCase());
                    const text = explanationToText(val).trim();
                    lines.push(`${label}: ${text}`);
                });
                if (lines.length) return lines.join("\n\n");
                try {
                    return JSON.stringify(value, null, 2);
                } catch (_) {
                    return String(value);
                }
            }

            return String(value);
        }

        function formatStepHtml(stepValue) {
            const escaped = escapeHtml(stepValue == null ? "" : String(stepValue));
            const boldPrefix = escaped.replace(
                /^(\s*Step\s*\d+\s*[:.)-]?)/i,
                "<strong>$1</strong>"
            );
            return `<div>${nlToBr(boldPrefix)}</div>`;
        }

        function stripDisplayMathDelimiters(text) {
            let t = String(text);
            t = t.replace(/([0-9A-Za-z]+)\$\$\$\$+([0-9A-Za-z]+)/g, "$1 $2");
            while (t.includes("$$$$")) {
                t = t.replace(/\$\$\$\$/g, "$$");
            }
            t = t.replace(/\$\$\s*([\s\S]*?)\s*\$\$/g, "\n$1\n");
            t = t.replace(/(?<=[0-9A-Za-z])\$\$(?=[0-9A-Za-z])/g, " ");
            t = t.replace(/\$\$/g, "");
            return t;
        }

        function formatExplanationHtml(value) {
            const text = stripDisplayMathDelimiters(explanationToText(value));
            const escaped = escapeHtml(text);
            const withBold = escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
            const normalizedMarkdown = withBold
                .replace(/^#{1,6}\s*(.+)$/gm, "<strong>$1</strong>")
                .replace(/^\s*[-*]\s+/gm, "• ")
                .replace(/^\s*>\s?/gm, "");
            return nlToBr(normalizedMarkdown);
        }

        function renderThinkingState(stepText) {
            const output = document.getElementById("output");
            output.innerHTML = `
                <div class="thinking-box">
                    <div class="thinking-title">SparkAI is thinking...</div>
                    <div class="thinking-step">${escapeHtml(stepText)}</div>
                </div>
            `;
        }

        function updateDifficulty() {
            const education = document.getElementById("education").value;
            const difficulty = document.getElementById("difficulty");
            const ageHidden = document.getElementById("age");

            let options = [];
            let ageValue = "";

            if (education === "middle") {
                options = ["Easy: 10–20 min", "Medium: 25–45 min", "Hard: 45–70 min"];
                ageValue = "10-14";
            } else if (education === "high") {
                options = ["Easy: 20–40 min", "Medium: 40–75 min", "Hard: 75–120 min"];
                ageValue = "15-18";
            } else if (education === "student") {
                options = ["Easy: 45–90 min", "Medium: 90–180 min", "Hard: 1–3 days"];
                ageValue = "18-25";
            } else {
                options = ["Easy: 60–120 min", "Medium: 2–4 hours", "Hard: 3–7 days"];
                ageValue = "25+";
            }

            ageHidden.value = ageValue;
            difficulty.innerHTML = options.map(o => `<option>${o}</option>`).join("");
        }

        async function generateProject() {
            const output = document.getElementById("output");
            const rawOutput = document.getElementById("rawOutput");
            output.innerHTML = "";
            rawOutput.style.display = "block";
            rawOutput.textContent = "Processing JSON response...";

            const engineeringField = document.getElementById("engineeringField").value;
            const difficulty = document.getElementById("difficulty").value;
            const age = document.getElementById("age").value;
            const materials = document.getElementById("materials").value;
            let thinkingTimer = null;

            try {
                const thinkingSteps = [
                    "Reading your preferences...",
                    "Designing project options...",
                    "Processing JSON output..."
                ];
                let thinkingIdx = 0;
                renderThinkingState(thinkingSteps[thinkingIdx]);
                thinkingTimer = setInterval(() => {
                    thinkingIdx = (thinkingIdx + 1) % thinkingSteps.length;
                    renderThinkingState(thinkingSteps[thinkingIdx]);
                }, 900);

                const descriptionWithField = [
                    "Generate 3 engineering project options for Associate mode.",
                    engineeringField ? `Engineering focus field: ${engineeringField}.` : null,
                    "User customization request: Keep projects practical and easy to personalize."
                ].filter(Boolean).join("\n");

                const response = await fetch("https://enginuity-cpl1.onrender.com/generate-project", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        description: descriptionWithField,
                        difficulty: difficulty,
                        age: age,
                        materials: materials
                    })
                });

                const data = await response.json();
                clearInterval(thinkingTimer);
                console.log(data);
                rawOutput.style.display = "none";
                rawOutput.textContent = "";
                window.lastProjectData = data;
                displayProjects(data);
            } catch (e) {
                if (thinkingTimer) clearInterval(thinkingTimer);
                rawOutput.style.display = "none";
                output.innerHTML = `<div class="error">Request failed: ${escapeHtml(e && e.message ? e.message : String(e))}</div>`;
            }
        }

        function displayProjects(data) {
            const output = document.getElementById("output");
            output.innerHTML = "";

            const payload = data && data.projects ? data.projects : null;

            if (payload && payload.error) {
                output.innerHTML = `<div class="error">${escapeHtml(payload.error)}</div>`;
                return;
            }

            const normalized = normalizeProjects(data);
            const projects = normalized.projects;
            const safetyWarnings = normalized.safetyWarnings;

            if (!projects.length) {
                output.innerHTML = `<div class="error">No projects returned.</div>`;
                return;
            }

            window.allProjects = projects;

            if (safetyWarnings.length) {
                const safetyDiv = document.createElement("div");
                safetyDiv.className = "safety";
                safetyDiv.innerHTML = `<strong>⚠️ Safety:</strong><div>${safetyWarnings.map(w => escapeHtml(w)).join("<br>")}</div>`;
                output.appendChild(safetyDiv);
            }

            projects.forEach((proj, index) => {
                const card = document.createElement("div");
                card.style.marginBottom = "10px";
                card.innerHTML = `
                    <button onclick="showProject(${index})">
                        ${escapeHtml(proj.title || "Project " + (index + 1))}
                    </button>
                `;
                output.appendChild(card);
            });

            const helper = document.createElement("div");
            helper.style.marginTop = "8px";
            helper.textContent = "Pick one project to view full instructions.";
            output.appendChild(helper);
        }

        function showProject(index) {
            const proj = (window.allProjects || [])[index];
            if (!proj) return;
            selectedProjectIndex = index;

            const output = document.getElementById("output");
            const materials = Array.isArray(proj.materials) ? proj.materials : [];
            const steps = Array.isArray(proj.steps) ? proj.steps : [];
            const materialsSuggested = Array.isArray(proj.materialsSuggested) ? proj.materialsSuggested : [];

            const stepsHtml = steps.map((s) => formatStepHtml(s)).join("<br>");
            const materialsHtml = materials.length
                ? `<ul>${materials.map(m => `<li>${escapeHtml(m)}</li>`).join("")}</ul>`
                : "<p>Not provided.</p>";
            const suggestedHtml = materialsSuggested.length
                ? `<div class="section"><strong>Materials Suggested:</strong><ul>${materialsSuggested.map(m => `<li>${escapeHtml(m)}</li>`).join("")}</ul></div>`
                : "";

            output.innerHTML = `
                <div class="project">
                    <div class="title">${escapeHtml(proj.title || "Untitled Project")}</div>
                    <div class="section"><strong>Description:</strong><pre class="pre">${escapeHtml(proj.description || "Not provided.")}</pre></div>
                    <div class="section"><strong>Materials Needed:</strong>${materialsHtml}</div>
                    ${suggestedHtml}
                    <div class="section"><strong>Steps:</strong><div>${stepsHtml || "Not provided."}</div></div>
                    <div class="section"><strong>Engineering Explanation:</strong><div class="pre">${formatExplanationHtml(proj.engineeringExplanation)}</div></div>
                    <div class="section"><strong>Physics Explanation:</strong><div class="pre">${formatExplanationHtml(proj.physicsExplanation)}</div></div>
                    <div class="contribution-box">
                        <label for="contributionInput"><strong>What additions do you want to contribute?</strong></label>
                        <textarea id="contributionInput" placeholder="Example: make it waterproof, add a Bluetooth sensor, reduce cost, or include a testing checklist."></textarea>
                        <div class="contribution-actions">
                            <button id="contributionRefreshBtn" onclick="refreshSelectedProject()">Refresh Project</button>
                            <button onclick="saveProject(${index})">💾 Save Project</button>
                        </div>
                        <div class="muted" id="contributionStatus"></div>
                    </div>
                </div>
                <button onclick="displayProjects(window.lastProjectData)">← Back to project choices</button>
            `;
        }

        async function refreshSelectedProject() {
            const output = document.getElementById("output");
            if (selectedProjectIndex == null) return;
            const proj = (window.allProjects || [])[selectedProjectIndex];
            if (!proj) return;

            const contributionInput = document.getElementById("contributionInput");
            const contribution = contributionInput ? contributionInput.value.trim() : "";
            const statusEl = document.getElementById("contributionStatus");
            const btn = document.getElementById("contributionRefreshBtn");

            if (!contribution) {
                if (statusEl) statusEl.textContent = "Please add a contribution request first.";
                return;
            }

            const engineeringField = document.getElementById("engineeringField").value;
            const difficulty = document.getElementById("difficulty").value;
            const age = document.getElementById("age").value;
            const materials = document.getElementById("materials").value;

            try {
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = "Loading...";
                }
                if (statusEl) statusEl.textContent = "Loading...";

                const baseMaterials = Array.isArray(proj.materials) ? proj.materials.join(", ") : "";
                const baseSteps = Array.isArray(proj.steps) ? proj.steps.join(" | ") : "";

                const updateDescription = [
                    "Generate exactly 1 updated engineering project for Associate mode.",
                    "Keep the same core concept, but apply the user's requested additions.",
                    engineeringField ? `Engineering focus field: ${engineeringField}.` : null,
                    `Current project title: ${proj.title || "Untitled"}`,
                    `Current description: ${proj.description || ""}`,
                    baseMaterials ? `Current materials: ${baseMaterials}` : null,
                    baseSteps ? `Current steps: ${baseSteps}` : null,
                    `User requested additions: ${contribution}`
                ].filter(Boolean).join("\n");

                const response = await fetch("https://enginuity-cpl1.onrender.com/generate-project", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        description: updateDescription,
                        difficulty: difficulty,
                        age: age,
                        materials: materials
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                const data = await response.json();
                const normalized = normalizeProjects(data);
                if (!normalized.projects.length) {
                    if (statusEl) statusEl.textContent = "Could not generate an updated project. Try a more specific addition.";
                    return;
                }

                const updated = normalized.projects[0];
                window.allProjects[selectedProjectIndex] = updated;
                if (statusEl) statusEl.textContent = "Updated! Showing your refreshed project.";
                showProject(selectedProjectIndex);
            } catch (e) {
                if (statusEl) statusEl.textContent = `Update failed: ${escapeHtml(e && e.message ? e.message : String(e))}`;
                output.scrollIntoView({ behavior: "smooth", block: "start" });
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = "Refresh Project";
                }
            }
        }

        function saveProject(index) {
            const project = (window.allProjects || [])[index];
            if (!project) return;
            if (typeof window.saveProjectWithMeta !== "function") {
                alert("Save service is unavailable.");
                return;
            }

            const saved = window.saveProjectWithMeta(project, {
                mode: MODE,
                page: "associate.html"
            });

            if (saved && typeof window.showSavedToast === "function") {
                window.showSavedToast("✅ Project saved!");
            }
        }

        function resumeSavedProjectIfAny() {
            if (typeof window.consumeResumeProject !== "function") return;
            const saved = window.consumeResumeProject();
            if (!saved) return;
            if (saved.page && saved.page !== "associate.html") return;
            window.allProjects = [saved];
            window.lastProjectData = { projects: { projects: [saved] } };
            showProject(0);
        }

        function renderSavedProject(project) {
            if (!project) return;
            window.allProjects = [project];
            window.lastProjectData = { projects: { projects: [project] } };
            showProject(0);
        }

        window.renderSavedProject = renderSavedProject;

        function normalizeProjects(data) {
            const source = data || {};
            const directPayload = source.projects || {};
            const safetyWarnings = Array.isArray(directPayload.safety_warnings) ? directPayload.safety_warnings : [];

            // Shape A: backend-style payload => { projects: { projects: [...] } }
            if (directPayload && Array.isArray(directPayload.projects)) {
                return {
                    projects: directPayload.projects.map((proj) => ({
                        title: proj.project_name || proj.title || "Untitled",
                        description: proj.description || "",
                        materials: proj.materials_needed || proj.materials || [],
                        materialsSuggested: proj.materials_suggested || [],
                        steps: proj.steps || [],
                        engineeringExplanation: proj.engineering_explanation || proj.engineeringExplanation || proj.engineering || "",
                        physicsExplanation: proj.physics_explanation || proj.physicsExplanation || proj.physics || ""
                    })),
                    safetyWarnings
                };
            }

            // Shape B: suggestion object => { suggestion: { "Name": { ... } } }
            if (source.suggestion && typeof source.suggestion === "object" && !Array.isArray(source.suggestion)) {
                const projects = Object.entries(source.suggestion).map(([name, proj]) => ({
                    title: name,
                    description: proj && proj.description ? proj.description : "",
                    materials: proj && Array.isArray(proj.materials_needed) ? proj.materials_needed : [],
                    materialsSuggested: proj && Array.isArray(proj.materials_suggested) ? proj.materials_suggested : [],
                    steps: proj && Array.isArray(proj.steps) ? proj.steps : [],
                    engineeringExplanation: proj ? (proj.engineering_explanation || proj.engineeringExplanation || proj.engineering || "") : "",
                    physicsExplanation: proj ? (proj.physics_explanation || proj.physicsExplanation || proj.physics || "") : ""
                }));

                return { projects, safetyWarnings: [] };
            }

            return { projects: [], safetyWarnings };
        }

        window.onload = function () {
            updateDifficulty();
            resumeSavedProjectIfAny();
        };
    </script>
    <script src="saved-projects.js" defer></script>
    <script src="enginuity-loading-screen.js" defer></script>
</body>
</html>
