<body class="enginuity-paper">
    <div class="container">
        <a class="back" href="index.html">← Back</a>

        <h1>Enginuity Beta · Apprentice</h1>
        <p class="subtitle">
            Fully guided, step-by-step learning designed for beginners.
        </p>

        <div class="generator">
            <h2>Spark Generator</h2>

            <label for="engineeringField">Field of engineering you are most interested in</label>
            <select id="engineeringField"></select>

            <label for="education">Education / age</label>
            <select id="education" onchange="updateDifficulty()"></select>
            <input type="hidden" id="age" value="" />

            <label for="difficulty">Difficulty (estimated time)</label>
            <select id="difficulty"></select>

            <label for="materials">What materials do you have?</label>
            <textarea id="materials" placeholder="List what you already have (be as specific as you can)"></textarea>

            <div class="actions">
                <button onclick="generateProject()">Generate Project</button>
            </div>
        </div>

        <div id="output"></div>
    </div>

    <script src="engineering-fields.js"></script>
    <script src="api-config.js"></script>
    <script src="auth-sync.js"></script>
    <script src="project-output.js"></script>
    <script src="user-plan.js"></script>
    <script src="concept-render.js"></script>
    <script src="saved-projects.js"></script>
    <script>
    const MODE = "Apprentice";
    window.MODE = MODE;
    localStorage.setItem("forge_mode", MODE);

    function escapeHtml(str) {
        return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll("\"", "&quot;")
            .replaceAll("'", "&#39;");
    }

    function toStringList(value) {
        if (window.ProjectOutput && typeof window.ProjectOutput.toStringList === "function") {
            return window.ProjectOutput.toStringList(value);
        }
        if (!value) return [];
        if (Array.isArray(value)) return value.map(String).filter(Boolean);
        return [String(value)];
    }

    function nlToBr(escaped) {
        return escaped.replace(/\n/g, "<br>");
    }

    /** First balanced {...} or [...] in s (string-aware); avoids greedy-regex breaks from LaTeX { } in prose. */
    function extractBalancedJsonSubstring(s) {
        const t = String(s).trim();
        if (!t.length) return null;
        const firstObj = t.indexOf("{");
        const firstArr = t.indexOf("[");
        let i0 = -1;
        if (firstObj === -1) i0 = firstArr;
        else if (firstArr === -1) i0 = firstObj;
        else i0 = Math.min(firstObj, firstArr);
        if (i0 === -1) return null;

        const stack = [];
        let inString = false;
        let escape = false;
        for (let i = i0; i < t.length; i++) {
            const ch = t[i];
            if (inString) {
                if (escape) {
                    escape = false;
                    continue;
                }
                if (ch === "\\") {
                    escape = true;
                    continue;
                }
                if (ch === '"') inString = false;
                continue;
            }
            if (ch === '"') {
                inString = true;
                continue;
            }
            if (ch === "{") {
                stack.push("}");
                continue;
            }
            if (ch === "[") {
                stack.push("]");
                continue;
            }
            if (ch === "}" || ch === "]") {
                if (!stack.length || ch !== stack[stack.length - 1]) continue;
                stack.pop();
                if (!stack.length) return t.slice(i0, i + 1);
            }
        }
        return null;
    }

    function explanationToText(value) {
        if (value == null || value === "") return "Not provided.";

        if (typeof value === "string") {
            const trimmed = value.trim();
            const withoutFence = trimmed
                .replace(/^```(?:json)?\s*/i, "")
                .replace(/```$/i, "")
                .trim();
            let jsonLike = null;
            if ((withoutFence.startsWith("{") && withoutFence.endsWith("}")) || (withoutFence.startsWith("[") && withoutFence.endsWith("]"))) {
                jsonLike = withoutFence;
            } else {
                jsonLike = extractBalancedJsonSubstring(withoutFence);
            }

            if (jsonLike) {
                try {
                    return explanationToText(JSON.parse(jsonLike));
                } catch (_) {
                    return withoutFence || value;
                }
            }
            return withoutFence || value;
        }

        if (Array.isArray(value)) {
            return value.map((item) => explanationToText(item)).join("\n");
        }

        if (typeof value === "object") {
            const preferredKeys = ["explanation", "physics_explanation", "physicsExplanation", "content", "message", "engineering_explanation", "engineeringExplanation", "text", "summary"];
            for (const key of preferredKeys) {
                if (Object.prototype.hasOwnProperty.call(value, key) && value[key]) {
                    return explanationToText(value[key]);
                }
            }
            const lines = [];
            Object.entries(value).forEach(([key, val]) => {
                if (val == null || val === "") return;
                const label = key
                    .replace(/_/g, " ")
                    .replace(/([a-z])([A-Z])/g, "$1 $2")
                    .replace(/\s+/g, " ")
                    .trim()
                    .replace(/^./, (c) => c.toUpperCase());
                const text = explanationToText(val).trim();
                lines.push(`${label}: ${text}`);
            });
            if (lines.length) return lines.join("\n\n");
            try {
                return JSON.stringify(value, null, 2);
            } catch (_) {
                return String(value);
            }
        }

        return String(value);
    }

    function formatStepHtml(stepValue) {
        const escaped = escapeHtml(stepValue == null ? "" : String(stepValue));
        const boldPrefix = escaped.replace(
            /^(\s*Step\s*\d+\s*[:.)-]?)/i,
            "<strong>$1</strong>"
        );
        return `<div>${nlToBr(boldPrefix)}</div>`;
    }

    function stripDisplayMathDelimiters(text) {
        let t = String(text);
        // Split words accidentally glued by $$$$ / long $ runs (e.g. "mass$$$$energy" → "mass energy").
        t = t.replace(/([0-9A-Za-z]+)\$\$\$\$+([0-9A-Za-z]+)/g, "$1 $2");
        // Models sometimes emit KaTeX-style $$$$ instead of $$.
        while (t.includes("$$$$")) {
            t = t.replace(/\$\$\$\$/g, "$$");
        }
        t = t.replace(/\$\$\s*([\s\S]*?)\s*\$\$/g, "\n$1\n");
        // Single orphan $$ between letters (no pair) — insert space so words don't merge.
        t = t.replace(/(?<=[0-9A-Za-z])\$\$(?=[0-9A-Za-z])/g, " ");
        t = t.replace(/\$\$/g, "");
        return t;
    }

    function formatExplanationHtml(value) {
        const text = stripDisplayMathDelimiters(explanationToText(value));
        const escaped = escapeHtml(text);
        const withBold = escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        return nlToBr(withBold);
    }

    function updateDifficulty() {
        const education = document.getElementById("education").value;
        const difficulty = document.getElementById("difficulty");
        const ageHidden = document.getElementById("age");

        const options = ["Easy: 8–20 min", "Medium: 30–50 min", "Hard: 50–75 min"];
        ageHidden.value = typeof window.ageForEducation === "function"
            ? window.ageForEducation(education)
            : "15-18";
        difficulty.innerHTML = options.map(o => `<option>${o}</option>`).join("");
    }

    function getSelectedEngineeringField() {
        const el = document.getElementById("engineeringField");
        const raw = el ? el.value : "";
        return typeof window.normalizeEngineeringField === "function"
            ? window.normalizeEngineeringField(raw)
            : String(raw || "").trim();
    }

    function clearActiveProjectForFieldChange() {
        const output = document.getElementById("output");
        if (output) output.innerHTML = "";
        window.allProjects = [];
        window.lastProjectData = null;
        if (typeof window.clearCurrentProject === "function") {
            window.clearCurrentProject();
        }
    }

    function renderThinkingState(stepText) {
        const output = document.getElementById("output");
        output.innerHTML = `
            <div class="thinking-box">
                <img class="thinking-box__bolt" src="assets/spark-ai-bolt.svg" width="36" height="36" alt="" aria-hidden="true" />
                <div class="thinking-title">SparkAI is designing your project...</div>
                <div class="thinking-step">${stepText}</div>
                <span class="spark-ai-powered spark-ai-powered--thinking">Powered by <strong>SparkAI</strong></span>
            </div>
        `;
    }

    // -----------------------------
    // Generate Project
    // -----------------------------
    async function generateProject() {
        if (typeof window.canUseApprenticeGeneration === "function") {
            const genCheck = window.canUseApprenticeGeneration();
            if (!genCheck.allowed) {
                alert(genCheck.message || "Generation limit reached.");
                return;
            }
        }

        const output = document.getElementById("output");
        output.innerHTML = "";

        const engineeringField = getSelectedEngineeringField();
        const difficulty = document.getElementById("difficulty").value;
        const age = document.getElementById("age").value;
        const materials = document.getElementById("materials").value;

        const fieldLine = typeof window.engineeringFieldFocusLine === "function"
            ? window.engineeringFieldFocusLine(engineeringField)
            : (engineeringField ? `Focus: ${engineeringField}.` : "");
        const descriptionWithField = [
            "3 beginner hands-on projects.",
            fieldLine || null,
            "Apprentice mode — full guidance."
        ].filter(Boolean).join(" ");

        const thinkingSteps = [
            "Reading your materials and goals...",
            "Sketching three build options...",
            "Polishing steps and explanations..."
        ];
        let thinkingIdx = 0;
        renderThinkingState(thinkingSteps[thinkingIdx]);
        const thinkingTimer = setInterval(() => {
            thinkingIdx = (thinkingIdx + 1) % thinkingSteps.length;
            renderThinkingState(thinkingSteps[thinkingIdx]);
        }, 900);

        try {
            const data = await window.enginuityPostJson("/generate-project", {
                description: descriptionWithField,
                difficulty: difficulty,
                age: age,
                materials: materials,
                mode: MODE,
                engineering_field: engineeringField
            });
            clearInterval(thinkingTimer);

            if (data && data.error) {
                output.innerHTML = `<div class="error">${escapeHtml(data.error)}${data.suggestion ? " " + escapeHtml(data.suggestion) : ""}</div>`;
                return;
            }

            const normalized = normalizeProjects(data, {
                difficulty: difficulty,
                engineeringField: engineeringField
            });
            if (normalized.projects.length) {
                if (typeof window.recordApprenticeGeneration === "function") {
                    window.recordApprenticeGeneration();
                }
            }
            window.lastProjectData = data;

            displayProjects(data);

        } catch (err) {
            clearInterval(thinkingTimer);
            output.innerHTML = `<div class="error">Error: ${escapeHtml(err && err.message ? err.message : String(err))}</div>`;
        }
    }

    // -----------------------------
    // Display Project Choices
    // -----------------------------
    function displayProjects(data) {
        const output = document.getElementById("output");
        output.innerHTML = "";
        if (window.ProjectOutput && typeof window.ProjectOutput.hideDoneBar === "function") {
            window.ProjectOutput.hideDoneBar();
        }

        if (data && data.error) {
            output.innerHTML = `<div class="error">${escapeHtml(data.error)}</div>`;
            return;
        }

        const payload = data && data.projects ? data.projects : null;

        if (payload && payload.error) {
            output.innerHTML = `<div class="error">${escapeHtml(payload.error)}</div>`;
            return;
        }

        const difficultyValue = document.getElementById("difficulty").value;
        const normalized = normalizeProjects(data, {
            difficulty: difficultyValue,
            engineeringField: getSelectedEngineeringField()
        });
        const projects = normalized.projects;
        const safetyWarnings = normalized.safetyWarnings;

        if (!projects.length) {
            output.innerHTML = `<div class="error">No projects returned.</div>`;
            return;
        }

        window.allProjects = projects;

        if (safetyWarnings.length) {
            const safetyDiv = document.createElement("div");
            safetyDiv.className = "safety";
            safetyDiv.innerHTML = `<strong>⚠️ Safety:</strong><div>${safetyWarnings.map(w => escapeHtml(w)).join("<br>")}</div>`;
            output.appendChild(safetyDiv);
        }

        if (!window.ProjectOutput) {
            projects.forEach((proj, i) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.textContent = escapeHtml(proj.title || "Project " + (i + 1));
                btn.onclick = function () { showProject(i); };
                btn.style.display = "block";
                btn.style.marginBottom = "8px";
                output.appendChild(btn);
            });
        } else {
            const choices = document.createElement("div");
            choices.innerHTML = window.ProjectOutput.renderProjectChoices(projects, {
                escapeHtml: escapeHtml
            });
            output.appendChild(choices);
        }
    }

    // -----------------------------
    // Show Full Project
    // -----------------------------
    function showProject(index) {
        const proj = (window.allProjects || [])[index];
        if (!proj) return;
        if (typeof window.setCurrentProject === "function") {
            window.setCurrentProject(proj);
        }
        if (typeof window.syncSparkHelperContext === "function") {
            window.syncSparkHelperContext();
        }
        const output = document.getElementById("output");

        const extraSections = [
            proj.engineeringExplanation
                ? `<section class="project-output__section"><h3 class="project-output__label">Engineering</h3><div class="project-output__prose">${formatExplanationHtml(proj.engineeringExplanation)}</div></section>`
                : "",
            proj.physicsExplanation
                ? `<section class="project-output__section"><h3 class="project-output__label">Physics</h3><div class="project-output__prose">${formatExplanationHtml(proj.physicsExplanation)}</div></section>`
                : ""
        ].join("");

        if (!window.ProjectOutput) {
            output.innerHTML =
                `<div><strong>${escapeHtml(proj.title || "Untitled")}</strong></div>` +
                `<p>${escapeHtml(proj.description || "")}</p>` +
                `<button type="button" onclick="saveProject(${index})">💾 Save Project</button>` +
                `<button type="button" onclick="displayProjects(window.lastProjectData)">← Back</button>`;
        } else {
            output.innerHTML =
                window.ProjectOutput.renderStructuredProject(proj, {
                    escapeHtml: escapeHtml,
                    extraSectionsHtml: extraSections,
                    actionsHtml: `<button type="button" onclick="saveProject(${index})">💾 Save Project</button>`
                }) +
                `<button type="button" onclick="displayProjects(window.lastProjectData)">← Back to project choices</button>`;
            window.ProjectOutput.afterStructuredRender(proj);
        }
    }

    // -----------------------------
    // Normalize AI Response
    // -----------------------------
    function normalizeProjects(data, meta) {
        meta = meta || {};
        const sessionDifficulty = meta.difficulty || "";
        const sessionField = meta.engineeringField || "";
        const source = data || {};
        const directPayload = source.projects || {};
        const safetyWarnings = Array.isArray(directPayload.safety_warnings) ? directPayload.safety_warnings : [];

        function mapProject(p) {
            return {
                title: p.project_name || p.title || "Untitled",
                description: p.description || "",
                materials: toStringList(p.materials_needed || p.materials),
                materialsSuggested: toStringList(p.materials_suggested),
                steps: toStringList(p.steps),
                buildPhases: p.build_phases || p.buildPhases || null,
                difficulty: p.difficulty || sessionDifficulty,
                estimatedTime: p.estimated_time || p.estimatedTime || sessionDifficulty,
                engineeringExplanation: p.engineering_explanation || p.engineeringExplanation || p.engineering || "",
                physicsExplanation: p.physics_explanation || p.physicsExplanation || p.physics || "",
                engineeringField: sessionField
            };
        }

        if (directPayload && Array.isArray(directPayload.projects)) {
            return {
                projects: directPayload.projects.map(mapProject),
                safetyWarnings
            };
        }

        if (source.suggestion && typeof source.suggestion === "object" && !Array.isArray(source.suggestion)) {
            const projects = Object.entries(source.suggestion).map(([name, p]) => ({
                title: name,
                description: p && p.description ? p.description : "",
                materials: toStringList(p && (p.materials_needed || p.materials)),
                materialsSuggested: toStringList(p && (p.materials_suggested || p.materialsSuggested)),
                steps: toStringList(p && p.steps),
                buildPhases: p && (p.build_phases || p.buildPhases) || null,
                difficulty: (p && p.difficulty) || sessionDifficulty,
                estimatedTime: (p && (p.estimated_time || p.estimatedTime)) || sessionDifficulty,
                engineeringExplanation: p ? (p.engineering_explanation || p.engineeringExplanation || p.engineering || "") : "",
                physicsExplanation: p ? (p.physics_explanation || p.physicsExplanation || p.physics || "") : "",
                engineeringField: sessionField
            }));

            return { projects, safetyWarnings: [] };
        }

        return { projects: [], safetyWarnings };
    }

    // -----------------------------
    // Save Project
    // -----------------------------
    function saveProject(index) {
        const project = (window.allProjects || [])[index];
        if (!project) return;
        if (typeof window.saveProjectWithMeta !== "function") {
            alert("Save service is unavailable.");
            return;
        }

        const saved = window.saveProjectWithMeta(project, {
            mode: MODE,
            page: "apprentice.html"
        });

        if (saved && typeof window.showSavedToast === "function") {
            window.showSavedToast("✅ Project saved!");
        }
    }

    // -----------------------------
    // Login Handling
    // -----------------------------
    function handleCredentialResponse(response) {
        const data = parseJwt(response.credential);

        localStorage.setItem("user_email", data.email);
        localStorage.setItem("user_name", data.name);

        document.getElementById("welcome").innerText = `Welcome, ${data.name}`;

        const btn = document.querySelector(".g_id_signin");
        if (btn) btn.style.display = "none";
    }

    // decode JWT
    function parseJwt(token) {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
            '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
        ).join(''));

        return JSON.parse(jsonPayload);
    }

    // -----------------------------
    // On Load
    // -----------------------------
    function resumeSavedProjectIfAny() {
        if (typeof window.consumeResumeProject !== "function") return;
        const saved = window.consumeResumeProject();
        if (!saved) return;
        if (saved.page && saved.page !== "apprentice.html") return;
        window.allProjects = [saved];
        window.lastProjectData = { projects: { projects: [saved] } };
        showProject(0);
    }

    function renderSavedProject(project) {
        if (!project) return;
        window.allProjects = [project];
        window.lastProjectData = { projects: { projects: [project] } };
        showProject(0);
    }

    window.renderSavedProject = renderSavedProject;

    window.onload = function () {
        if (typeof window.populateEngineeringFieldSelect === "function") {
            window.populateEngineeringFieldSelect(document.getElementById("engineeringField"));
        }
        if (typeof window.populateEducationSelect === "function") {
            window.populateEducationSelect(document.getElementById("education"), "high");
        }
        updateDifficulty();
        if (typeof window.bindEngineeringFieldGuard === "function") {
            window.bindEngineeringFieldGuard(document.getElementById("engineeringField"), {
                getActiveField: function () {
                    var current = typeof window.getCurrentProject === "function"
                        ? window.getCurrentProject()
                        : null;
                    if (current && current.engineeringField) return current.engineeringField;
                    var first = (window.allProjects || [])[0];
                    return first && first.engineeringField ? first.engineeringField : "";
                },
                onMismatch: clearActiveProjectForFieldChange
            });
        }

        const name = localStorage.getItem("user_name");
        if (name) {
            var welcomeEl = document.getElementById("welcome");
            if (welcomeEl) {
                welcomeEl.innerText = `Welcome, ${name}`;
            }

            const btn = document.querySelector(".g_id_signin");
            if (btn) btn.style.display = "none";
        }

        resumeSavedProjectIfAny();
    };
</script>
